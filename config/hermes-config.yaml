# Josemar Hermes Agent authoritative configuration template.
# Secrets are passed through environment variables or /opt/data/.env.

# Matches the config schema bundled with nousresearch/hermes-agent:v2026.8.31.
_config_version: 39

model:
  default: "deepseek-v4-pro"
  provider: "deepseek"

fallback_providers:
  - provider: "ollama-cloud"
    model: "glm-5.2:cloud"

terminal:
  backend: "local"
  cwd: "/opt/data"
  timeout: 180
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true

memory:
  # Base template: native static injection enabled (MEMORY.md/USER.md injected
  # every turn). When the Mnemosyne pilot overlay is enabled, the container init
  # sets memory_enabled=false and user_profile_enabled=false at runtime
  # (upstream-native Mnemosyne, not curated-static coexistence). The static
  # files remain at their versioned paths as archive/rollback material; they
  # are NOT injected while the pilot is active. On rollback (base-only init),
  # the template copy restores these flags to true.
  memory_enabled: true
  user_profile_enabled: true
  # Stage built-in memory writes so archived static context (MEMORY.md/USER.md)
  # is not mutated without approval. This is intentionally NOT enforced by
  # josemar_skill_state.py POLICY_KEYS: it is preserved/un-enforced by the
  # skill policy so the operator can change it at runtime. It is retained as
  # archive protection even when Mnemosyne is active; it protects built-in
  # archive writes but does not prevent passive capture or necessarily all
  # Mnemosyne tools. Do not set memory.provider here; the container init sets
  # it at runtime only when MNEMOSYNE_PROVIDER=mnemosyne, and sets the nested
  # memory.mnemosyne block (default_scope, profile_isolation, auto_sleep,
  # reflect, sync_roles, skip_contexts, sync_turn limits) via hermes_cli.config.
  # The tools key is intentionally omitted so the provider exposes all
  # upstream-native tools (including mutating operations). Automatic ingestion
  # is passive raw user-turn capture; explicit mutation/management tools remain
  # available. No auto-sleep/reflection/LLM consolidation runs in the pilot.
  write_approval: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6

session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4

group_sessions_per_user: true

cron:
  wrap_response: false

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20
  protect_first_n: 3

skills:
  creation_nudge_interval: 0
  write_approval: true
  external_dirs:
    - /opt/josemar/skills
    - /opt/data/skills

curator:
  enabled: false

platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]

mcp_servers:
  tasknotes:
    command: "/opt/hermes/.venv/bin/python3"
    args:
      - "/opt/josemar/scripts/tasknotes_mcp.py"
    env:
      LLAMA_SERVER_BASE_URL: "${LLAMA_SERVER_BASE_URL}"
      GBRAIN_EMBEDDING_MODEL_REVISION: "${GBRAIN_EMBEDDING_MODEL_REVISION}"
      GBRAIN_EMBEDDING_MODEL: "${GBRAIN_EMBEDDING_MODEL}"
      GBRAIN_EMBEDDING_DIMENSIONS: "${GBRAIN_EMBEDDING_DIMENSIONS}"
      # Issue #139: explicitly forward the strict daily-links switches to
      # the MCP subprocess. Compose defaults both to true; missing/empty
      # enables. The reconcile slave is effective only while the master
      # daily-links switch is also true.
      TASKNOTES_DAILY_LINKS_ENABLED: "${TASKNOTES_DAILY_LINKS_ENABLED}"
      TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED: "${TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED}"
    connect_timeout: 30
    timeout: 180
    supports_parallel_tool_calls: false

display:
  compact: true
  tool_progress: new
  interim_assistant_messages: true
  long_running_notifications: true
  platforms:
    telegram:
      tool_progress: false
      cleanup_progress: true

auxiliary:
  vision:
    provider: "ollama-cloud"
    model: "kimi-k2.7-code"
    base_url: ""
    api_key: ""
    timeout: 120
    download_timeout: 30

agent:
  max_turns: 60
  reasoning_effort: "medium"
  verbose: false
  verify_on_stop: false

# Restart-time default for Hermes approvals. This repo template is copied
# into the runtime config on every container startup, so `manual` is the
# restart-time default. It is intentionally NOT re-enforced by
# josemar_skill_state/workspace sync, so Hermes Desktop v0.19 can change
# the live gateway setting between restarts.
approvals:
  mode: manual
  cron_mode: deny
  deny: []

# Browser routing (issue #136): three intentionally distinct web-access paths.
# Ordinary interactive/rendered web work uses the built-in browser_* toolset
# backed by a deterministic server-headless Chromium (pinned Chrome for
# Testing, baked into the Josemar image at /opt/josemar/agent-browser);
# authenticated/session-bearing operator-browser work uses the
# separate connected_browser_exec tool against browser.connected_cdp_url;
# public read-only research prefers search/extraction tools. No browser-control
# overlay is required for the ordinary route.
browser:
  # Explicit and quoted: keeps the Browser Use CLI from replacing the
  # built-in browser tools (upstream browser_exec stays hidden).
  backend: "off"
  # Deterministic local backend: prevents credential auto-detection from
  # silently converting browser_* into a cloud browser.
  cloud_provider: "local"
  # Josemar-owned connected-browser endpoint, read ONLY by
  # connected_browser_exec: when the browser-control Compose profile is
  # enabled and a laptop has established the reverse SSH tunnel, Chrome's CDP
  # discovery endpoint is reachable at 127.0.0.1:9222 inside the Hermes
  # container (the browser-tunnel sidecar shares Hermes's network namespace).
  # The connected tool preflights this endpoint via /json/version and fails
  # closed (never falls back to the server browser or a cloud browser).
  # Deliberately NOT the upstream global browser.cdp_url / BROWSER_CDP_URL:
  # the ordinary route must never consume it. Leave this URL pointing at
  # 127.0.0.1:9222; never expose CDP on 0.0.0.0 or via Tailscale Funnel.
  # See docs/browser-control.md for enablement and laptop setup.
  connected_cdp_url: "http://127.0.0.1:9222"

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
