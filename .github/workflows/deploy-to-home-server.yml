name: deploy-to-home-server

on:
  workflow_dispatch:
    inputs:
      fresh_start:
        description: 'Disabled for /opt/data state layout. Use a manual, reviewed cleanup instead.'
        required: false
        default: false
        type: boolean
      skip_git_sync:
        description: 'Skip git sync on this deployment (use local /opt/data state only)'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clean up work directory
        run: sudo rm -rf ${{ github.workspace }}/credentials || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug User Info
        run: |
          echo "Current user: $(whoami)"
          echo "User ID: $(id -u)"
          echo "Group ID: $(id -g)"
          echo "Groups: $(id -Gn)"
          echo "Docker group members: $(getent group docker)"
          echo "Docker socket permissions: $(ls -la /var/run/docker.sock 2>/dev/null || echo 'Docker socket not found')"

      - name: Validate required repository variables
        env:
          WORKSPACE_STATE_REPO: ${{ vars.WORKSPACE_STATE_REPO }}
          SYNCTHING_GUI_BIND_IP: ${{ vars.SYNCTHING_GUI_BIND_IP }}
          HERMES_DASHBOARD_BIND_IP: ${{ vars.HERMES_DASHBOARD_BIND_IP }}
          HERMES_BASE_IMAGE: ${{ vars.HERMES_BASE_IMAGE }}
          BROWSER_CONTROL_ENABLED_INPUT: ${{ vars.BROWSER_CONTROL_ENABLED }}
          BROWSER_CONTROL_SUBNET: ${{ vars.BROWSER_CONTROL_SUBNET }}
          BROWSER_CONTROL_GATEWAY: ${{ vars.BROWSER_CONTROL_GATEWAY }}
          BROWSER_CONTROL_HERMES_IP: ${{ vars.BROWSER_CONTROL_HERMES_IP }}
          BROWSER_CONTROL_TAILSCALE_IP: ${{ vars.BROWSER_CONTROL_TAILSCALE_IP }}
          BROWSER_TUNNEL_AUTHORIZED_KEY: ${{ secrets.BROWSER_TUNNEL_AUTHORIZED_KEY }}
          MNEMOSYNE_DEPLOY_MODE_INPUT: ${{ vars.MNEMOSYNE_DEPLOY_MODE }}
          GBRAIN_EMBEDDINGS_ENABLED_INPUT: ${{ vars.GBRAIN_EMBEDDINGS_ENABLED }}
          TASKNOTES_DAILY_LINKS_ENABLED_INPUT: ${{ vars.TASKNOTES_DAILY_LINKS_ENABLED }}
          TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED_INPUT: ${{ vars.TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED }}
          MNEMOSYNE_BACKUP_EXPORT_INTERVAL_INPUT: ${{ vars.MNEMOSYNE_BACKUP_EXPORT_INTERVAL }}
          RCLONE_CONFIG_B64_SECRET: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$WORKSPACE_STATE_REPO" ]; then
            echo "ERROR: Repository variable WORKSPACE_STATE_REPO is required"
            exit 1
          fi

          # Production base-image pin contract (issue #89, review R1): when
          # the HERMES_BASE_IMAGE repository variable is set, it must equal
          # the reviewed Dockerfile.hermes pin exactly. Base-image upgrades
          # change the Dockerfile ARG pin and the reviewed tripwire
          # (EXPECTED_HERMES_BASE_IMAGE in
          # tests/skill_state/test_models_overlay.py) TOGETHER, and the
          # auxiliary allowlist must be re-reviewed against that release.
          # Empty is allowed: Compose then uses its repo-authored default.
          # Local/development override stays outside this production gate.
          if [ -n "$HERMES_BASE_IMAGE" ] && [ "$HERMES_BASE_IMAGE" != "nousresearch/hermes-agent:v2026.8.18" ]; then
            echo "ERROR: HERMES_BASE_IMAGE must be empty (repo-authored Compose default) or exactly 'nousresearch/hermes-agent:v2026.8.18' (got: $HERMES_BASE_IMAGE)"
            echo "       Base-image upgrades change the reviewed pin contract TOGETHER: the Dockerfile.hermes ARG pin, the docker-compose.yml Compose default build arg, and the reviewed tripwire (EXPECTED_HERMES_BASE_IMAGE in tests/skill_state/test_models_overlay.py); update all three and re-review the auxiliary allowlist against the new release before setting this variable."
            exit 1
          fi

          GUI_BIND_IP="$SYNCTHING_GUI_BIND_IP"
          if [ -n "$GUI_BIND_IP" ]; then
            if [ "$GUI_BIND_IP" = "0.0.0.0" ]; then
              echo "ERROR: SYNCTHING_GUI_BIND_IP cannot be 0.0.0.0"
              exit 1
            fi
            if ! echo "$GUI_BIND_IP" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ERROR: SYNCTHING_GUI_BIND_IP must be an IPv4 address when set"
              exit 1
            fi
          fi

          DASHBOARD_BIND_IP="$HERMES_DASHBOARD_BIND_IP"
          if [ -n "$DASHBOARD_BIND_IP" ]; then
            if [ "$DASHBOARD_BIND_IP" = "0.0.0.0" ]; then
              echo "ERROR: HERMES_DASHBOARD_BIND_IP cannot be 0.0.0.0"
              exit 1
            fi
            if ! echo "$DASHBOARD_BIND_IP" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ERROR: HERMES_DASHBOARD_BIND_IP must be an IPv4 address when set"
              exit 1
            fi
          fi

          # Browser control is optional and disabled by default. When enabled,
          # require a single-line SSH public key secret and validate subnet/IP
          # overrides together using ipaddress (Python stdlib, no installs).
          # SSH user (tunnel), SSH port (2222), and CDP port (9222) are fixed
          # constants and not configurable.
          BROWSER_CONTROL_ENABLED="$BROWSER_CONTROL_ENABLED_INPUT"
          if [ -z "$BROWSER_CONTROL_ENABLED" ]; then
            BROWSER_CONTROL_ENABLED="false"
          fi
          if [ "$BROWSER_CONTROL_ENABLED" != "true" ] && [ "$BROWSER_CONTROL_ENABLED" != "false" ]; then
            echo "ERROR: BROWSER_CONTROL_ENABLED must be 'true' or 'false' (got: $BROWSER_CONTROL_ENABLED)"
            exit 1
          fi

          if [ "$BROWSER_CONTROL_ENABLED" = "true" ]; then
            if [ -z "$BROWSER_TUNNEL_AUTHORIZED_KEY" ]; then
              echo "ERROR: BROWSER_TUNNEL_AUTHORIZED_KEY secret is required when BROWSER_CONTROL_ENABLED=true"
              exit 1
            fi
            if [[ "$BROWSER_TUNNEL_AUTHORIZED_KEY" == *$'\n'* || "$BROWSER_TUNNEL_AUTHORIZED_KEY" == *$'\r'* ]]; then
              echo "ERROR: BROWSER_TUNNEL_AUTHORIZED_KEY must be a single-line SSH public key"
              exit 1
            fi
            if ! printf '%s' "$BROWSER_TUNNEL_AUTHORIZED_KEY" | grep -Eq '^(ssh-(rsa|ed25519|dss)|ecdsa-sha2-nistp(256|384|521)|sk-(ssh-ed25519|ecdsa-sha2-nistp256)) [A-Za-z0-9+/=]+( .*)?$'; then
              echo "ERROR: BROWSER_TUNNEL_AUTHORIZED_KEY does not look like a single OpenSSH public key line"
              exit 1
            fi

            # Validate subnet/IP overrides together using ipaddress. Defaults
            # are applied later; here we validate any provided overrides.
            python3 - <<'PY'
          import ipaddress
          import os
          import sys

          subnet = os.environ.get("BROWSER_CONTROL_SUBNET") or "172.31.250.0/29"
          gateway = os.environ.get("BROWSER_CONTROL_GATEWAY") or "172.31.250.1"
          hermes = os.environ.get("BROWSER_CONTROL_HERMES_IP") or "172.31.250.2"
          ts = os.environ.get("BROWSER_CONTROL_TAILSCALE_IP") or "172.31.250.3"

          provided = {
              "BROWSER_CONTROL_SUBNET": os.environ.get("BROWSER_CONTROL_SUBNET"),
              "BROWSER_CONTROL_GATEWAY": os.environ.get("BROWSER_CONTROL_GATEWAY"),
              "BROWSER_CONTROL_HERMES_IP": os.environ.get("BROWSER_CONTROL_HERMES_IP"),
              "BROWSER_CONTROL_TAILSCALE_IP": os.environ.get("BROWSER_CONTROL_TAILSCALE_IP"),
          }
          if any(provided.values()):
              missing = [k for k, v in provided.items() if not v]
              if missing:
                  print(f"ERROR: when overriding browser-control networking, set {', '.join(missing)} together with the others")
                  sys.exit(1)

          try:
              net = ipaddress.ip_network(subnet, strict=True)
          except ValueError as exc:
              print(f"ERROR: BROWSER_CONTROL_SUBNET is not a valid strict network: {subnet} ({exc})")
              sys.exit(1)
          if net.version != 4:
              print(f"ERROR: BROWSER_CONTROL_SUBNET must be IPv4: {subnet}")
              sys.exit(1)

          ips = {}
          for name, value in (("BROWSER_CONTROL_GATEWAY", gateway),
                              ("BROWSER_CONTROL_HERMES_IP", hermes),
                              ("BROWSER_CONTROL_TAILSCALE_IP", ts)):
              try:
                  addr = ipaddress.ip_address(value)
              except ValueError as exc:
                  print(f"ERROR: {name} is not a valid IPv4 address: {value} ({exc})")
                  sys.exit(1)
              if addr.version != 4:
                  print(f"ERROR: {name} must be IPv4: {value}")
                  sys.exit(1)
              if addr not in net:
                  print(f"ERROR: {name} {addr} is not inside subnet {net}")
                  sys.exit(1)
              if addr in (net.network_address, net.broadcast_address):
                  print(f"ERROR: {name} {addr} is the network/broadcast address and not usable")
                  sys.exit(1)
              ips[name] = addr

          if len(set(ips.values())) != len(ips):
              print("ERROR: BROWSER_CONTROL_GATEWAY, BROWSER_CONTROL_HERMES_IP, and BROWSER_CONTROL_TAILSCALE_IP must be unique")
              sys.exit(1)
          PY
          fi

          # ---- Mnemosyne deploy mode (default off) ----
          # Allowed values: off, pilot, backup. Any other value is rejected
          # BEFORE any volume mutation or service teardown. The Mnemosyne
          # overlays are: pilot = base+embeddings+mnemosyne, backup = those
          # plus the backup overlay. Standalone gbrain embeddings (mode off
          # with GBRAIN_EMBEDDINGS_ENABLED=true) is a separate, valid
          # configuration and is handled by the embeddings selection logic,
          # not by this mode.
          MNEMOSYNE_DEPLOY_MODE="$MNEMOSYNE_DEPLOY_MODE_INPUT"
          if [ -z "$MNEMOSYNE_DEPLOY_MODE" ]; then
            MNEMOSYNE_DEPLOY_MODE="off"
          fi
          case "$MNEMOSYNE_DEPLOY_MODE" in
            off|pilot|backup) ;;
            *)
              echo "ERROR: MNEMOSYNE_DEPLOY_MODE must be one of: off, pilot, backup (got: $MNEMOSYNE_DEPLOY_MODE)"
              exit 1
              ;;
          esac

          GBRAIN_EMBEDDINGS_ENABLED="$GBRAIN_EMBEDDINGS_ENABLED_INPUT"
          if [ -z "$GBRAIN_EMBEDDINGS_ENABLED" ]; then
            GBRAIN_EMBEDDINGS_ENABLED="false"
          fi
          if [ "$GBRAIN_EMBEDDINGS_ENABLED" != "true" ] && [ "$GBRAIN_EMBEDDINGS_ENABLED" != "false" ]; then
            echo "ERROR: GBRAIN_EMBEDDINGS_ENABLED must be 'true' or 'false' (got: $GBRAIN_EMBEDDINGS_ENABLED)"
            exit 1
          fi

          # TaskNotes MCP daily-note task links (issue #139 revision 3):
          # strict default-on booleans, validated BEFORE any volume mutation
          # or service teardown. Missing/empty enables; a nonempty value must
          # be case-insensitive true/false and is normalized to lowercase for
          # .env. The reconcile slave is effective only while the master
          # daily-links switch is also true. The MCP server re-validates at
          # engine init (fail-closed).
          TASKNOTES_DAILY_LINKS_ENABLED="$TASKNOTES_DAILY_LINKS_ENABLED_INPUT"
          if [ -z "$TASKNOTES_DAILY_LINKS_ENABLED" ]; then
            TASKNOTES_DAILY_LINKS_ENABLED="true"
          else
            TASKNOTES_DAILY_LINKS_ENABLED="$(printf '%s' "$TASKNOTES_DAILY_LINKS_ENABLED" | tr '[:upper:]' '[:lower:]')"
          fi
          if [ "$TASKNOTES_DAILY_LINKS_ENABLED" != "true" ] && [ "$TASKNOTES_DAILY_LINKS_ENABLED" != "false" ]; then
            echo "ERROR: TASKNOTES_DAILY_LINKS_ENABLED must be 'true' or 'false' (got: $TASKNOTES_DAILY_LINKS_ENABLED)"
            exit 1
          fi

          # Reconcile slave: same strict validation and stable default-on.
          # An explicit false rolls back reconciliation only; the master
          # daily-links switch gates the whole projection either way.
          TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED="$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED_INPUT"
          if [ -z "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" ]; then
            TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED="true"
          else
            TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED="$(printf '%s' "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" | tr '[:upper:]' '[:lower:]')"
          fi
          if [ "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" != "true" ] && [ "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" != "false" ]; then
            echo "ERROR: TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED must be 'true' or 'false' (got: $TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED)"
            exit 1
          fi

          # backup-mode prerequisites: positive-integer export interval AND a
          # base64 rclone config secret. Validate before mutating volumes or
          # stopping services. Reject leading-zero forms (e.g. 007) and values
          # exceeding 10080 minutes (1 week).
          if [ "$MNEMOSYNE_DEPLOY_MODE" = "backup" ]; then
            EXPORT_INTERVAL="$MNEMOSYNE_BACKUP_EXPORT_INTERVAL_INPUT"
            if [ -z "$EXPORT_INTERVAL" ]; then
              echo "ERROR: MNEMOSYNE_BACKUP_EXPORT_INTERVAL repo variable is required when MNEMOSYNE_DEPLOY_MODE=backup"
              exit 1
            fi
            # Reject leading zeros: "007", "00", "01" are not canonical.
            case "$EXPORT_INTERVAL" in
              0*)
                echo "ERROR: MNEMOSYNE_BACKUP_EXPORT_INTERVAL must be a positive integer without leading zeros (got: $EXPORT_INTERVAL)"
                exit 1
                ;;
            esac
            if ! printf '%s' "$EXPORT_INTERVAL" | grep -Eq '^[0-9]+$'; then
              echo "ERROR: MNEMOSYNE_BACKUP_EXPORT_INTERVAL must be a positive integer (got: $EXPORT_INTERVAL)"
              exit 1
            fi
            if [ "$EXPORT_INTERVAL" -le 0 ]; then
              echo "ERROR: MNEMOSYNE_BACKUP_EXPORT_INTERVAL must be a positive integer (got: $EXPORT_INTERVAL)"
              exit 1
            fi
            if [ "$EXPORT_INTERVAL" -gt 10080 ]; then
              echo "ERROR: MNEMOSYNE_BACKUP_EXPORT_INTERVAL must not exceed 10080 minutes (1 week) (got: $EXPORT_INTERVAL)"
              exit 1
            fi
            if [ -z "$RCLONE_CONFIG_B64_SECRET" ]; then
              echo "ERROR: RCLONE_CONFIG_B64 secret is required when MNEMOSYNE_DEPLOY_MODE=backup"
              exit 1
            fi
          fi

          # ---- Vault-recovery encrypted lane (default backup, Phase 3) ----
          # The encrypted vault-recovery lane REPLACED the retired plaintext
          # obsidian-backup service and is part of the default deployment
          # composition. RCLONE_CONFIG_B64 is therefore REQUIRED for every
          # deployment: without the vault-recovery-crypt remote the deploy
          # FAILS here, before any volume mutation or teardown, rather than
          # silently deploying without backups.
          if [ -z "$RCLONE_CONFIG_B64_SECRET" ]; then
            echo "ERROR: RCLONE_CONFIG_B64 secret is required: the vault-recovery encrypted backup lane is the default deployment composition and its crypt remote must be configured (set the RCLONE_CONFIG_B64 secret)"
            exit 1
          fi

          echo "MNEMOSYNE_DEPLOY_MODE=$MNEMOSYNE_DEPLOY_MODE" >> "$GITHUB_ENV"
          echo "GBRAIN_EMBEDDINGS_ENABLED=$GBRAIN_EMBEDDINGS_ENABLED" >> "$GITHUB_ENV"
          echo "TASKNOTES_DAILY_LINKS_ENABLED=$TASKNOTES_DAILY_LINKS_ENABLED" >> "$GITHUB_ENV"
          echo "TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED=$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" >> "$GITHUB_ENV"

      - name: Vault-recovery portability proof (mandatory release gate)
        # The phase-1 vault-recovery feature is release-blocked on the
        # physical-copy portability proof: a full `.gbrain` tree with REAL
        # vector-bearing DB state must copy and open on the pinned image
        # (doctor, vectors, DB-only records, config, schema packs/markers)
        # without reindex/rebuild/sync. This gate runs BEFORE any volume
        # mutation or service teardown and FAILS the deploy when the proof
        # does not pass. VAULT_RECOVERY_PORTABILITY_REQUIRED=1 makes a
        # missing docker CLI a failure, not a skip — there is no
        # RUN_DOCKER_TESTS opt-in bypass on the release path.
        run: |
          python3 -m unittest tests.runtime.test_vault_recovery_portability -v
        env:
          RUN_DOCKER_TESTS: "1"
          VAULT_RECOVERY_PORTABILITY_REQUIRED: "1"

      - name: Vault-recovery disaster-recovery drill (mandatory release gate)
        # Phase 3: the FULL disaster-recovery drill is a mandatory
        # release/deploy gate, not a recommendation: disposable runtime,
        # real vector-bearing state, export + encrypted upload, ordered
        # maintenance window (all three owned jobs paused, Hermes and server
        # Syncthing stopped), DESTROY of both live trees, recover/verify/
        # install, controlled restart, survival proofs, rollback. A missing
        # docker CLI or any failed assertion FAILS the deploy —
        # VAULT_RECOVERY_DR_DRILL_REQUIRED=1 makes the opt-in env var
        # irrelevant and a missing docker CLI a failure, not a skip.
        run: |
          python3 -m unittest tests.runtime.test_vault_recovery_dr_drill -v
        env:
          RUN_DOCKER_TESTS: "1"
          VAULT_RECOVERY_DR_DRILL_REQUIRED: "1"

      - name: Create .env file
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PRIMARY_TELEGRAM_ID: ${{ secrets.PRIMARY_TELEGRAM_ID }}
          GOG_KEYRING_PASSWORD: ${{ secrets.GOG_KEYRING_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          WORKSPACE_STATE_REPO: ${{ vars.WORKSPACE_STATE_REPO }}
          WORKSPACE_REPO_TOKEN: ${{ secrets.WORKSPACE_REPO_TOKEN }}
          WORKSPACE_SYNC_ON_START_VALUE: ${{ github.event.inputs.skip_git_sync == 'false' && 'true' || 'false' }}
          JOSEMAR_CONTAINER_PREFIX_INPUT: ${{ vars.JOSEMAR_CONTAINER_PREFIX }}
          HERMES_BASE_IMAGE: ${{ vars.HERMES_BASE_IMAGE }}
          GOGCLI_REF: ${{ vars.GOGCLI_REF }}
          TZ_VALUE: ${{ vars.TZ }}
          TAILSCALE_HOSTNAME: ${{ vars.TAILSCALE_HOSTNAME }}
          TS_EXTRA_ARGS: ${{ vars.TS_EXTRA_ARGS }}
          SYNCTHING_GUI_BIND_IP: ${{ vars.SYNCTHING_GUI_BIND_IP }}
          HERMES_API_SERVER_ENABLED_INPUT: ${{ vars.HERMES_API_SERVER_ENABLED }}
          HERMES_API_SERVER_BIND_IP: ${{ vars.HERMES_API_SERVER_BIND_IP }}
          HERMES_API_SERVER_PORT: ${{ vars.HERMES_API_SERVER_PORT }}
          HERMES_API_SERVER_KEY: ${{ secrets.HERMES_API_SERVER_KEY }}
          HERMES_API_SERVER_CORS_ORIGINS: ${{ vars.HERMES_API_SERVER_CORS_ORIGINS }}
          HERMES_API_SERVER_MODEL_NAME_INPUT: ${{ vars.HERMES_API_SERVER_MODEL_NAME }}
          HERMES_DEFAULT_PROFILE_DISPLAY_NAME_INPUT: ${{ vars.HERMES_DEFAULT_PROFILE_DISPLAY_NAME }}
          HERMES_DASHBOARD_BIND_IP: ${{ vars.HERMES_DASHBOARD_BIND_IP }}
          HERMES_DASHBOARD_SESSION_TOKEN: ${{ secrets.HERMES_DASHBOARD_SESSION_TOKEN }}
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME_INPUT: ${{ vars.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
          HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_SECRET }}
          AUX_ML_ENABLED_INPUT: ${{ vars.AUX_ML_ENABLED }}
          AUX_ML_MEMORY_LIMIT: ${{ vars.AUX_ML_MEMORY_LIMIT }}
          AUX_ML_MEMORY_LIMIT_MB: ${{ vars.AUX_ML_MEMORY_LIMIT_MB }}
          AUX_ML_MAX_QUEUE: ${{ vars.AUX_ML_MAX_QUEUE }}
          AUX_ML_JOB_TIMEOUT_SECONDS: ${{ vars.AUX_ML_JOB_TIMEOUT_SECONDS }}
          AUX_ML_POLL_INTERVAL_SECONDS: ${{ vars.AUX_ML_POLL_INTERVAL_SECONDS }}
          AUX_ML_LLAMACPP_TIMEOUT_SECONDS: ${{ vars.AUX_ML_LLAMACPP_TIMEOUT_SECONDS }}
          AUX_ML_ENFORCE_MEMORY_LIMIT: ${{ vars.AUX_ML_ENFORCE_MEMORY_LIMIT }}
          AUX_ML_OCR_MAX_PAGES: ${{ vars.AUX_ML_OCR_MAX_PAGES }}
          BROWSER_CONTROL_ENABLED_INPUT: ${{ vars.BROWSER_CONTROL_ENABLED }}
          BROWSER_CONTROL_SUBNET: ${{ vars.BROWSER_CONTROL_SUBNET }}
          BROWSER_CONTROL_GATEWAY: ${{ vars.BROWSER_CONTROL_GATEWAY }}
          BROWSER_CONTROL_HERMES_IP: ${{ vars.BROWSER_CONTROL_HERMES_IP }}
          BROWSER_CONTROL_TAILSCALE_IP: ${{ vars.BROWSER_CONTROL_TAILSCALE_IP }}
          BROWSER_TUNNEL_AUTHORIZED_KEY: ${{ secrets.BROWSER_TUNNEL_AUTHORIZED_KEY }}
          MNEMOSYNE_DEPLOY_MODE_INPUT: ${{ vars.MNEMOSYNE_DEPLOY_MODE }}
          MNEMOSYNE_BACKUP_EXPORT_INTERVAL_INPUT: ${{ vars.MNEMOSYNE_BACKUP_EXPORT_INTERVAL }}
          GBRAIN_EMBEDDINGS_ENABLED_INPUT: ${{ vars.GBRAIN_EMBEDDINGS_ENABLED }}
          TASKNOTES_DAILY_LINKS_ENABLED_INPUT: ${{ vars.TASKNOTES_DAILY_LINKS_ENABLED }}
          TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED_INPUT: ${{ vars.TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED }}
        run: |
          GBRAIN_EMBEDDINGS_ENABLED="${GBRAIN_EMBEDDINGS_ENABLED_INPUT:-false}"
          if [ "$GBRAIN_EMBEDDINGS_ENABLED" != "true" ] && [ "$GBRAIN_EMBEDDINGS_ENABLED" != "false" ]; then
            echo "ERROR: GBRAIN_EMBEDDINGS_ENABLED must be 'true' or 'false' (got: $GBRAIN_EMBEDDINGS_ENABLED)"
            exit 1
          fi

          # TaskNotes MCP daily-note task links (issue #139 revision 3):
          # re-derive the strict default-on booleans from the repo variables
          # and re-validate so the values written to .env are normalized
          # lowercase true/false. The reconcile slave is effective only while
          # the master daily-links switch is also true. No Daily Notes
          # folder/date/template or vault path is env-driven.
          TASKNOTES_DAILY_LINKS_ENABLED="$TASKNOTES_DAILY_LINKS_ENABLED_INPUT"
          if [ -z "$TASKNOTES_DAILY_LINKS_ENABLED" ]; then
            TASKNOTES_DAILY_LINKS_ENABLED="true"
          else
            TASKNOTES_DAILY_LINKS_ENABLED="$(printf '%s' "$TASKNOTES_DAILY_LINKS_ENABLED" | tr '[:upper:]' '[:lower:]')"
          fi
          if [ "$TASKNOTES_DAILY_LINKS_ENABLED" != "true" ] && [ "$TASKNOTES_DAILY_LINKS_ENABLED" != "false" ]; then
            echo "ERROR: TASKNOTES_DAILY_LINKS_ENABLED must be 'true' or 'false' (got: $TASKNOTES_DAILY_LINKS_ENABLED)"
            exit 1
          fi

          TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED="$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED_INPUT"
          if [ -z "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" ]; then
            TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED="true"
          else
            TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED="$(printf '%s' "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" | tr '[:upper:]' '[:lower:]')"
          fi
          if [ "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" != "true" ] && [ "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED" != "false" ]; then
            echo "ERROR: TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED must be 'true' or 'false' (got: $TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED)"
            exit 1
          fi

          AUX_ML_ENABLED="$AUX_ML_ENABLED_INPUT"
          if [ -z "$AUX_ML_ENABLED" ]; then
            AUX_ML_ENABLED="true"
          fi

          COMPOSE_PROFILES_VALUE=""
          if [ "$AUX_ML_ENABLED" = "true" ]; then
            COMPOSE_PROFILES_VALUE="aux-ml"
          fi

          BROWSER_CONTROL_ENABLED="$BROWSER_CONTROL_ENABLED_INPUT"
          if [ -z "$BROWSER_CONTROL_ENABLED" ]; then
            BROWSER_CONTROL_ENABLED="false"
          fi

          # Apply browser-control subnet/IP defaults.
          BC_SUBNET="${BROWSER_CONTROL_SUBNET:-172.31.250.0/29}"
          BC_GATEWAY="${BROWSER_CONTROL_GATEWAY:-172.31.250.1}"
          BC_HERMES="${BROWSER_CONTROL_HERMES_IP:-172.31.250.2}"
          BC_TS="${BROWSER_CONTROL_TAILSCALE_IP:-172.31.250.3}"

          if [ "$BROWSER_CONTROL_ENABLED" = "true" ]; then
            if [ -n "$COMPOSE_PROFILES_VALUE" ]; then
              COMPOSE_PROFILES_VALUE="${COMPOSE_PROFILES_VALUE},browser-control"
            else
              COMPOSE_PROFILES_VALUE="browser-control"
            fi
          fi

          JOSEMAR_CONTAINER_PREFIX="$JOSEMAR_CONTAINER_PREFIX_INPUT"
          if [ -z "$JOSEMAR_CONTAINER_PREFIX" ]; then
            JOSEMAR_CONTAINER_PREFIX="josemar"
          fi

          if [[ "$JOSEMAR_CONTAINER_PREFIX" == *$'\n'* || "$JOSEMAR_CONTAINER_PREFIX" == *$'\r'* ]]; then
            echo "ERROR: JOSEMAR_CONTAINER_PREFIX must be single-line"
            exit 1
          fi

          if [[ ! "$JOSEMAR_CONTAINER_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]]; then
            echo "ERROR: JOSEMAR_CONTAINER_PREFIX must match ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
            exit 1
          fi

          HERMES_API_SERVER_ENABLED="$HERMES_API_SERVER_ENABLED_INPUT"
          if [ -z "$HERMES_API_SERVER_ENABLED" ]; then
            HERMES_API_SERVER_ENABLED="false"
          fi

          if [ -z "$HERMES_API_SERVER_BIND_IP" ]; then
            HERMES_API_SERVER_BIND_IP="127.0.0.1"
          fi

          if [ -z "$HERMES_API_SERVER_PORT" ]; then
            HERMES_API_SERVER_PORT="8642"
          fi

          HERMES_API_SERVER_MODEL_NAME="$HERMES_API_SERVER_MODEL_NAME_INPUT"
          if [ -z "$HERMES_API_SERVER_MODEL_NAME" ]; then
            HERMES_API_SERVER_MODEL_NAME="Josemar"
          fi

          HERMES_DEFAULT_PROFILE_DISPLAY_NAME="$HERMES_DEFAULT_PROFILE_DISPLAY_NAME_INPUT"
          if [ -z "$HERMES_DEFAULT_PROFILE_DISPLAY_NAME" ]; then
            HERMES_DEFAULT_PROFILE_DISPLAY_NAME="Josemar"
          fi

          if [[ "$HERMES_DEFAULT_PROFILE_DISPLAY_NAME" == *$'\n'* || "$HERMES_DEFAULT_PROFILE_DISPLAY_NAME" == *$'\r'* ]]; then
            echo "ERROR: HERMES_DEFAULT_PROFILE_DISPLAY_NAME must be single-line"
            exit 1
          fi

          if [ "${#HERMES_DEFAULT_PROFILE_DISPLAY_NAME}" -gt 64 ]; then
            echo "ERROR: HERMES_DEFAULT_PROFILE_DISPLAY_NAME must be at most 64 characters"
            exit 1
          fi

          if [[ ! "$HERMES_DEFAULT_PROFILE_DISPLAY_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "ERROR: HERMES_DEFAULT_PROFILE_DISPLAY_NAME must match ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
            exit 1
          fi

          if [ "$HERMES_API_SERVER_ENABLED" = "true" ] && [ -z "$HERMES_API_SERVER_KEY" ]; then
            echo "ERROR: HERMES_API_SERVER_KEY secret is required when HERMES_API_SERVER_ENABLED=true"
            exit 1
          fi

          if [ -z "$HERMES_DASHBOARD_SESSION_TOKEN" ]; then
            echo "ERROR: HERMES_DASHBOARD_SESSION_TOKEN secret is required for Hermes Desktop dashboard access"
            exit 1
          fi

          if [[ ! "$HERMES_DASHBOARD_SESSION_TOKEN" =~ ^[A-Za-z0-9._~-]{32,}$ ]]; then
            echo "ERROR: HERMES_DASHBOARD_SESSION_TOKEN must be at least 32 URL-safe characters"
            exit 1
          fi

          if [ -z "$HERMES_DASHBOARD_BIND_IP" ]; then
            HERMES_DASHBOARD_BIND_IP="127.0.0.1"
          fi

          HERMES_DASHBOARD_BASIC_AUTH_USERNAME="$HERMES_DASHBOARD_BASIC_AUTH_USERNAME_INPUT"
          if [ -z "$HERMES_DASHBOARD_BASIC_AUTH_USERNAME" ]; then
            HERMES_DASHBOARD_BASIC_AUTH_USERNAME="admin"
          fi

          if [[ "$HERMES_DASHBOARD_BASIC_AUTH_USERNAME" == *$'\n'* || "$HERMES_DASHBOARD_BASIC_AUTH_USERNAME" == *$'\r'* ]]; then
            echo "ERROR: HERMES_DASHBOARD_BASIC_AUTH_USERNAME must be single-line"
            exit 1
          fi

          if [ -z "$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD" ]; then
            echo "ERROR: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD secret is required for browser dashboard login"
            exit 1
          fi

          if [[ "$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD" == *$'\n'* || "$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD" == *$'\r'* ]]; then
            echo "ERROR: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD must be single-line"
            exit 1
          fi

          if [ "${#HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}" -lt 16 ]; then
            echo "ERROR: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD must be at least 16 characters"
            exit 1
          fi

          if [ -z "$HERMES_DASHBOARD_BASIC_AUTH_SECRET" ]; then
            echo "ERROR: HERMES_DASHBOARD_BASIC_AUTH_SECRET secret is required for browser dashboard sessions"
            exit 1
          fi

          if [[ "$HERMES_DASHBOARD_BASIC_AUTH_SECRET" == *$'\n'* || "$HERMES_DASHBOARD_BASIC_AUTH_SECRET" == *$'\r'* ]]; then
            echo "ERROR: HERMES_DASHBOARD_BASIC_AUTH_SECRET must be single-line"
            exit 1
          fi

          if [ "${#HERMES_DASHBOARD_BASIC_AUTH_SECRET}" -lt 32 ]; then
            echo "ERROR: HERMES_DASHBOARD_BASIC_AUTH_SECRET must be at least 32 characters"
            exit 1
          fi

          umask 077
          : > .env
          write_env() {
            printf '%s=%s\n' "$1" "$2" >> .env
          }

          write_env ZAI_API_KEY "$ZAI_API_KEY"
          write_env TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          write_env DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
          write_env OLLAMA_API_KEY "$OLLAMA_API_KEY"
          write_env TAVILY_API_KEY "$TAVILY_API_KEY"
          write_env PRIMARY_TELEGRAM_ID "$PRIMARY_TELEGRAM_ID"
          write_env GOG_KEYRING_PASSWORD "$GOG_KEYRING_PASSWORD"
          write_env TS_AUTHKEY "$TS_AUTHKEY"
          write_env WORKSPACE_STATE_REPO "$WORKSPACE_STATE_REPO"
          write_env WORKSPACE_REPO_TOKEN "$WORKSPACE_REPO_TOKEN"
          write_env WORKSPACE_SYNC_ON_START "$WORKSPACE_SYNC_ON_START_VALUE"
          write_env WORKSPACE_SYNC_INTERVAL "60"
          write_env JOSEMAR_CONTAINER_PREFIX "$JOSEMAR_CONTAINER_PREFIX"
          write_env HERMES_BASE_IMAGE "$HERMES_BASE_IMAGE"
          write_env GOGCLI_REF "$GOGCLI_REF"
          write_env HERMES_TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          write_env HERMES_TELEGRAM_ALLOWED_USERS "$PRIMARY_TELEGRAM_ID"
          write_env HERMES_TELEGRAM_HOME_CHANNEL "$PRIMARY_TELEGRAM_ID"
          write_env HERMES_GATEWAY_ALLOWED_USERS "$PRIMARY_TELEGRAM_ID"
          write_env HERMES_API_SERVER_ENABLED "$HERMES_API_SERVER_ENABLED"
          write_env HERMES_API_SERVER_BIND_IP "$HERMES_API_SERVER_BIND_IP"
          write_env HERMES_API_SERVER_PORT "$HERMES_API_SERVER_PORT"
          write_env HERMES_API_SERVER_KEY "$HERMES_API_SERVER_KEY"
          write_env HERMES_API_SERVER_CORS_ORIGINS "$HERMES_API_SERVER_CORS_ORIGINS"
          write_env HERMES_API_SERVER_MODEL_NAME "$HERMES_API_SERVER_MODEL_NAME"
          write_env HERMES_DEFAULT_PROFILE_DISPLAY_NAME "$HERMES_DEFAULT_PROFILE_DISPLAY_NAME"
          write_env HERMES_DASHBOARD_BIND_IP "$HERMES_DASHBOARD_BIND_IP"
          write_env HERMES_DASHBOARD_INSECURE "0"
          write_env HERMES_DASHBOARD_TUI "1"
          write_env HERMES_DASHBOARD_SESSION_TOKEN "$HERMES_DASHBOARD_SESSION_TOKEN"
          write_env HERMES_DASHBOARD_BASIC_AUTH_USERNAME "$HERMES_DASHBOARD_BASIC_AUTH_USERNAME"
          write_env HERMES_DASHBOARD_BASIC_AUTH_PASSWORD "$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"
          write_env HERMES_DASHBOARD_BASIC_AUTH_SECRET "$HERMES_DASHBOARD_BASIC_AUTH_SECRET"
          write_env TZ "$TZ_VALUE"
          write_env TAILSCALE_HOSTNAME "$TAILSCALE_HOSTNAME"
          write_env TS_EXTRA_ARGS "$TS_EXTRA_ARGS"
          write_env SYNCTHING_GUI_BIND_IP "$SYNCTHING_GUI_BIND_IP"
          write_env AUX_ML_ENABLED "$AUX_ML_ENABLED"
          write_env COMPOSE_PROFILES "$COMPOSE_PROFILES_VALUE"
          write_env AUX_ML_URL "http://aux-ml:8091"
          write_env AUX_ML_MEMORY_LIMIT "$AUX_ML_MEMORY_LIMIT"
          write_env AUX_ML_MEMORY_LIMIT_MB "$AUX_ML_MEMORY_LIMIT_MB"
          write_env AUX_ML_MAX_QUEUE "$AUX_ML_MAX_QUEUE"
          write_env AUX_ML_JOB_TIMEOUT_SECONDS "$AUX_ML_JOB_TIMEOUT_SECONDS"
          write_env AUX_ML_POLL_INTERVAL_SECONDS "$AUX_ML_POLL_INTERVAL_SECONDS"
          write_env AUX_ML_LLAMACPP_TIMEOUT_SECONDS "$AUX_ML_LLAMACPP_TIMEOUT_SECONDS"
          write_env AUX_ML_ALLOWED_INPUT_DIRS "/shared"
          write_env AUX_ML_ENFORCE_MEMORY_LIMIT "$AUX_ML_ENFORCE_MEMORY_LIMIT"
          write_env AUX_ML_OCR_MAX_PAGES "$AUX_ML_OCR_MAX_PAGES"

          # Browser control (optional). Subnet/IP overrides are written only
          # when enabled; the overlay reads them with defaults. SSH user/port
          # and CDP port are fixed constants and not written here.
          write_env BROWSER_CONTROL_ENABLED "$BROWSER_CONTROL_ENABLED"
          if [ "$BROWSER_CONTROL_ENABLED" = "true" ]; then
            write_env BROWSER_CONTROL_SUBNET "$BC_SUBNET"
            write_env BROWSER_CONTROL_GATEWAY "$BC_GATEWAY"
            write_env BROWSER_CONTROL_HERMES_IP "$BC_HERMES"
            write_env BROWSER_CONTROL_TAILSCALE_IP "$BC_TS"
          fi

          # ---- Mnemosyne deploy mode (default off) ----
          # off    -> no Mnemosyne overlays (baseline behavior preserved).
          # pilot  -> base + embeddings + mnemosyne overlays.
          # backup -> pilot + mnemosyne-backup overlay; export interval must be
          #           a positive integer and RCLONE_CONFIG_B64 must be present
          #           (validated in the prior step).
          MNEMOSYNE_DEPLOY_MODE="$MNEMOSYNE_DEPLOY_MODE_INPUT"
          if [ -z "$MNEMOSYNE_DEPLOY_MODE" ]; then
            MNEMOSYNE_DEPLOY_MODE="off"
          fi

          if [ "$MNEMOSYNE_DEPLOY_MODE" = "backup" ]; then
            MNEMOSYNE_BACKUP_EXPORT_INTERVAL="$MNEMOSYNE_BACKUP_EXPORT_INTERVAL_INPUT"
          else
            # Off/pilot: keep the overlay default (0 = cron disabled). The
            # pilot overlay does not include the backup overlay, so the export
            # cron is not installed regardless of this value.
            MNEMOSYNE_BACKUP_EXPORT_INTERVAL="${MNEMOSYNE_BACKUP_EXPORT_INTERVAL_INPUT:-0}"
          fi
          # Write the export interval so the backup overlay's interpolation
          # resolves deterministically. Inert when the backup overlay is not
          # applied (off/pilot).
          write_env MNEMOSYNE_BACKUP_EXPORT_INTERVAL "$MNEMOSYNE_BACKUP_EXPORT_INTERVAL"
          # Hardcode the crypt remote name in .env so the deploy validation
          # (which hardcodes mnemosyne-crypt) and the runtime Compose overlay
          # cannot diverge. This matches the overlay default and the value
          # validated in the "Decode and validate rclone config" step.
          write_env MNEMOSYNE_BACKUP_RCLONE_REMOTE "mnemosyne-crypt"
          # Hardcode the vault-recovery crypt remote name in .env so the
          # deploy validation (which hardcodes vault-recovery-crypt) and the
          # runtime Compose overlay cannot diverge. This matches the overlay
          # default and the value validated in the "Decode and validate
          # rclone config" step. The vault-recovery encrypted lane is the
          # DEFAULT backup composition (Phase 3).
          write_env VAULT_RECOVERY_RCLONE_REMOTE "vault-recovery-crypt"
          write_env GBRAIN_EMBEDDINGS_ENABLED "$GBRAIN_EMBEDDINGS_ENABLED"
          write_env TASKNOTES_DAILY_LINKS_ENABLED "$TASKNOTES_DAILY_LINKS_ENABLED"
          write_env TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED "$TASKNOTES_DAILY_LINKS_RECONCILE_ENABLED"

          chmod 600 .env
          echo "COMPOSE_PROFILES=$COMPOSE_PROFILES_VALUE" >> "$GITHUB_ENV"
          echo "JOSEMAR_CONTAINER_PREFIX=$JOSEMAR_CONTAINER_PREFIX" >> "$GITHUB_ENV"
          echo "BROWSER_CONTROL_ENABLED=$BROWSER_CONTROL_ENABLED" >> "$GITHUB_ENV"
          echo "BC_HERMES_IP=$BC_HERMES" >> "$GITHUB_ENV"
          echo "MNEMOSYNE_DEPLOY_MODE=$MNEMOSYNE_DEPLOY_MODE" >> "$GITHUB_ENV"
          echo "MNEMOSYNE_BACKUP_EXPORT_INTERVAL=$MNEMOSYNE_BACKUP_EXPORT_INTERVAL" >> "$GITHUB_ENV"
          echo "GBRAIN_EMBEDDINGS_ENABLED=$GBRAIN_EMBEDDINGS_ENABLED" >> "$GITHUB_ENV"

      - name: Set compose profiles
        run: |
          echo "COMPOSE_PROFILES=${COMPOSE_PROFILES}"
          echo "BROWSER_CONTROL_ENABLED=${BROWSER_CONTROL_ENABLED}"

      - name: Derive compose file and validate config
        # Derive COMPOSE_FILE with strict ordering and render it with
        # `docker compose config --quiet` BEFORE any volume mutation, volume
        # write, or service teardown. This is the fail-closed preflight: an
        # invalid overlay combination exits non-zero without touching state.
        # Ordering: base; vault-recovery (DEFAULT encrypted backup lane,
        # Phase 3 — always applied, replacing the retired plaintext
        # obsidian-backup service); optional browser-control; embeddings;
        # mnemosyne; backup last. browser-control is the only overlay whose
        # presence depends on a separate repo variable
        # (BROWSER_CONTROL_ENABLED). The embeddings overlay is appended
        # exactly once when GBRAIN_EMBEDDINGS_ENABLED=true OR
        # MNEMOSYNE_DEPLOY_MODE is pilot/backup (standalone gbrain embeddings
        # is valid with mode off). The Mnemosyne overlays are appended in
        # fixed order based on MNEMOSYNE_DEPLOY_MODE.
        run: |
          set -euo pipefail
          COMPOSE_FILE_VALUE="docker-compose.yml"
          # The vault-recovery overlay is ALWAYS part of the deployment
          # composition (default encrypted backup lane).
          COMPOSE_FILE_VALUE="${COMPOSE_FILE_VALUE}:docker-compose.vault-recovery.yml"
          if [ "${BROWSER_CONTROL_ENABLED}" = "true" ]; then
            COMPOSE_FILE_VALUE="${COMPOSE_FILE_VALUE}:docker-compose.browser-control.yml"
          fi
          if [ "${GBRAIN_EMBEDDINGS_ENABLED}" = "true" ] || [ "${MNEMOSYNE_DEPLOY_MODE:-off}" = "pilot" ] || [ "${MNEMOSYNE_DEPLOY_MODE:-off}" = "backup" ]; then
            COMPOSE_FILE_VALUE="${COMPOSE_FILE_VALUE}:docker-compose.embeddings.yml"
          fi
          case "${MNEMOSYNE_DEPLOY_MODE:-off}" in
            backup)
              COMPOSE_FILE_VALUE="${COMPOSE_FILE_VALUE}:docker-compose.mnemosyne.yml:docker-compose.mnemosyne-backup.yml"
              ;;
            pilot)
              COMPOSE_FILE_VALUE="${COMPOSE_FILE_VALUE}:docker-compose.mnemosyne.yml"
              ;;
            off) ;;
            *)
              echo "ERROR: MNEMOSYNE_DEPLOY_MODE must be one of: off, pilot, backup (got: ${MNEMOSYNE_DEPLOY_MODE:-unset})"
              exit 1
              ;;
          esac
          echo "COMPOSE_FILE=$COMPOSE_FILE_VALUE" >> "$GITHUB_ENV"
          # Render the selected COMPOSE_FILE with --quiet so an invalid
          # overlay combination fails closed without mutating volumes or
          # stopping services. Build the -f list explicitly from the derived
          # value (do not rely on the runner shell honoring COMPOSE_FILE).
          IFS=':' read -ra FILES <<< "$COMPOSE_FILE_VALUE"
          ARGS=()
          for f in "${FILES[@]}"; do
            ARGS+=("-f" "$f")
          done
          docker compose "${ARGS[@]}" config --quiet

      - name: Decode and validate rclone config
        # Decode RCLONE_CONFIG_B64 to a mode-0600 config file inside a
        # disposable temp DIRECTORY and validate the required remotes
        # BEFORE any volume mutation or service teardown. The directory
        # (NOT a single file) is mounted WRITABLE into the probe containers
        # because rclone refreshes the working config (e.g. OAuth token
        # refresh) via a sibling temp file + atomic rename, which a
        # read-only single-file mount cannot support. The
        # vault-recovery-crypt remote is REQUIRED FOR EVERY DEPLOYMENT
        # (the encrypted vault-recovery lane is the default backup
        # composition, Phase 3): type=crypt, nonempty remote, nonempty
        # password, AND the metadata-encryption standard (filename
        # encryption `standard`, directory-name encryption enabled) —
        # validated INDEPENDENTLY of MNEMOSYNE_DEPLOY_MODE, so backup-mode
        # toggles can never skip the default lane's preflight. In backup
        # mode the mnemosyne-crypt remote is validated the same way. The
        # pinned rclone image entrypoint is `["rclone"]`, so we invoke
        # rclone directly (no `sh -c`). No config/secrets are printed.
        # The temp directory path and the pre-probe config checksum are
        # exported for the later publish step; the publish step owns the
        # cleanup (it traps recursive removal on EVERY exit), and this step
        # traps recursive removal on every FAILURE path below (disarmed on
        # success so the publish step can still use the directory).
        env:
          RCLONE_CONFIG_B64_SECRET: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          RCLONE_PINNED_IMAGE="rclone/rclone@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548"
          # Hardcoded remote names — must match the Compose overlay defaults
          # and the values written to .env. Do NOT interpolate from an env
          # var that could diverge from Compose.
          VAULT_RECOVERY_REMOTE_NAME="vault-recovery-crypt"
          MNEMOSYNE_REMOTE_NAME="mnemosyne-crypt"

          if [ -z "$RCLONE_CONFIG_B64_SECRET" ]; then
            echo "ERROR: RCLONE_CONFIG_B64 secret is required: the vault-recovery encrypted backup lane is the default deployment composition"
            exit 1
          fi

          # Disposable temp DIRECTORY, not a single file: rclone refreshes
          # the working config (OAuth token refresh) by writing a sibling
          # temp file and atomically renaming it over the config, so the
          # config must live in a directory that is mounted WRITABLE into
          # the probe containers.
          TMP_RCLONE_DIR="$(mktemp -d)"
          RCLONE_CONF="$TMP_RCLONE_DIR/rclone.conf"
          # Trap cleanup on ALL failure paths after mktemp -d: the decoded
          # secret must never linger on the runner when this step fails.
          # Disarmed on success (the publish step owns the directory and
          # traps its recursive removal on every exit).
          trap 'rm -rf "$TMP_RCLONE_DIR"' EXIT
          if ! printf '%s' "$RCLONE_CONFIG_B64_SECRET" | base64 --decode > "$RCLONE_CONF" 2>/dev/null; then
            echo "ERROR: RCLONE_CONFIG_B64 is not valid base64"
            exit 1
          fi
          if [ ! -s "$RCLONE_CONF" ]; then
            echo "ERROR: RCLONE_CONFIG_B64 decoded to an empty config"
            exit 1
          fi
          chmod 600 "$RCLONE_CONF"

          # FOUR independent field checks (not OR). Parse each field
          # separately. We never print the config output. Uses the pinned
          # image with a direct `rclone` invocation (image entrypoint).
          # The temp directory is mounted WRITABLE (explicit :rw) so rclone
          # can atomically refresh the working config in place if needed.
          # Every rclone container runs as the HOST RUNNER UID:GID (the
          # --user flag built from the runner's id -u and id -g): a config
          # rewritten by rclone (sibling temp file + atomic rename) must
          # stay runner-owned so the host runner can still sha256 it in
          # the publish step (live ownership regression: a root-owned 0600
          # config was unreadable).
          validate_crypt_remote() {
            REMOTE_NAME="$1"
            if ! docker run --rm \
                --user "$(id -u):$(id -g)" \
                -v "$TMP_RCLONE_DIR:/tmp/rclone-conf:rw" \
                "$RCLONE_PINNED_IMAGE" \
                --config /tmp/rclone-conf/rclone.conf config show "${REMOTE_NAME}:" \
                >/dev/null 2>&1; then
              echo "ERROR: rclone remote '${REMOTE_NAME}' not found in RCLONE_CONFIG_B64"
              exit 1
            fi
            REMOTE_SHOW="$(docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$TMP_RCLONE_DIR:/tmp/rclone-conf:rw" \
              "$RCLONE_PINNED_IMAGE" \
              --config /tmp/rclone-conf/rclone.conf config show "${REMOTE_NAME}:" 2>/dev/null || true)"
            # 1. type must be exactly crypt.
            REMOTE_TYPE="$(printf '%s\n' "$REMOTE_SHOW" | sed -n 's/^type[[:space:]]*=[[:space:]]*//p' | tr -d '[:space:]')"
            if [ "$REMOTE_TYPE" != "crypt" ]; then
              echo "ERROR: rclone remote '${REMOTE_NAME}' is not type crypt (got: '${REMOTE_TYPE}')"
              exit 1
            fi
            # 2. remote must be present and nonempty (the underlying storage).
            CRYPT_REMOTE="$(printf '%s\n' "$REMOTE_SHOW" | sed -n 's/^remote[[:space:]]*=[[:space:]]*//p' | tr -d '[:space:]')"
            if [ -z "$CRYPT_REMOTE" ]; then
              echo "ERROR: rclone crypt remote '${REMOTE_NAME}' must have a nonempty remote"
              exit 1
            fi
            # 3. password must be present and nonempty (obscured by rclone).
            CRYPT_PASSWORD="$(printf '%s\n' "$REMOTE_SHOW" | sed -n 's/^password[[:space:]]*=[[:space:]]*//p' | tr -d '[:space:]')"
            if [ -z "$CRYPT_PASSWORD" ]; then
              echo "ERROR: rclone crypt remote '${REMOTE_NAME}' must have a nonempty password"
              exit 1
            fi
            # 4. metadata-encryption standard: filename_encryption must be
            #    `standard` (absent = rclone default `standard`; `off`/
            #    `obfuscate` would leak plaintext file names in the
            #    ciphertext metadata) and directory_name_encryption must
            #    not be `false` (absent = rclone default `true`).
            CRYPT_FILENAME_ENC="$(printf '%s\n' "$REMOTE_SHOW" | sed -n 's/^filename_encryption[[:space:]]*=[[:space:]]*//p' | tr -d '[:space:]')"
            if [ -n "$CRYPT_FILENAME_ENC" ] && [ "$CRYPT_FILENAME_ENC" != "standard" ]; then
              echo "ERROR: rclone crypt remote '${REMOTE_NAME}' filename_encryption is '${CRYPT_FILENAME_ENC}' (must be 'standard'): plaintext file names would leak in the ciphertext metadata"
              exit 1
            fi
            CRYPT_DIRNAME_ENC="$(printf '%s\n' "$REMOTE_SHOW" | sed -n 's/^directory_name_encryption[[:space:]]*=[[:space:]]*//p' | tr -d '[:space:]')"
            if [ "$CRYPT_DIRNAME_ENC" = "false" ]; then
              echo "ERROR: rclone crypt remote '${REMOTE_NAME}' directory_name_encryption is 'false' (must be 'true'): plaintext directory names would leak in the ciphertext metadata"
              exit 1
            fi
            echo "rclone crypt remote '${REMOTE_NAME}' validated"
          }

          # Default lane: vault-recovery-crypt is required on EVERY deploy,
          # independent of the Mnemosyne backup mode.
          validate_crypt_remote "$VAULT_RECOVERY_REMOTE_NAME"
          if [ "${MNEMOSYNE_DEPLOY_MODE:-off}" = "backup" ]; then
            validate_crypt_remote "$MNEMOSYNE_REMOTE_NAME"
          fi

          # Record the pre-probe checksum of the working config so the
          # publish step can detect an rclone-side refresh (e.g. OAuth
          # token refresh during the readiness probes) and publish the
          # UPDATED config into the shared volume.
          RCLONE_CONFIG_SHA256="$(sha256sum "$RCLONE_CONF" | awk '{print $1}')"

          echo "RCLONE_TEMP_DIR=$TMP_RCLONE_DIR" >> "$GITHUB_ENV"
          echo "RCLONE_CONFIG_SHA256=$RCLONE_CONFIG_SHA256" >> "$GITHUB_ENV"
          # Success: the publish step (the next step) owns the temp
          # directory and removes it on every exit; disarm the failure trap
          # so the directory survives this step's shell exit.
          trap - EXIT

      - name: Vault-recovery remote readiness gate (real upload probe)
        # Migration cutover proof (council fix 2): a SYNTACTICALLY VALID but
        # UNREACHABLE crypt remote must abort the deploy BEFORE any teardown
        # — the existing deployment (and any legacy lane state) is retained
        # untouched. The config-level validation above proves the remote is
        # well-formed; this gate proves the REAL production remote accepts a
        # write, a read-back, and a delete through the crypt boundary (the
        # initial generation's round trip must be possible before the old
        # lane is retired). The probe object lives under the remote base
        # path, NOT inside the committed namespace, so it can never be
        # mistaken for a generation by listing/retention/recovery. The
        # disposable temp DIRECTORY is mounted WRITABLE into the probe
        # containers so rclone can refresh the working config (OAuth token
        # refresh: sibling temp file + atomic rename) during the real
        # probes; the UPDATED config is then detected and published by the
        # publish step. Every probe container runs as the HOST RUNNER
        # UID:GID (--user "$(id -u):$(id -g)") so a config rewritten by
        # rclone stays runner-owned and host-readable for the publish
        # step's checksum (live ownership regression). The step
        # traps recursive removal of the temp directory on EVERY exit (a
        # readiness failure must never leave the decoded secret on the
        # runner) and disarms the trap on success, when the publish step
        # (next) takes over as the final cleanup owner.
        run: |
          set -euo pipefail
          TMP_RCLONE_DIR="${RCLONE_TEMP_DIR:-}"
          RCLONE_CONF="$TMP_RCLONE_DIR/rclone.conf"
          # Cleanup ownership (council fix): this step itself can FAIL (an
          # unreachable remote aborts the deploy here), and the decode step
          # already disarmed its failure trap on success. Trap RECURSIVE
          # removal of the decoded-secret temp DIRECTORY on EVERY exit of
          # this step so a readiness failure can never leave it on the
          # runner; disarmed only on success so the publish step (the final
          # owner) can still use it.
          trap 'rm -rf "$TMP_RCLONE_DIR"' EXIT
          if [ -z "$TMP_RCLONE_DIR" ] || [ ! -s "$RCLONE_CONF" ]; then
            echo "ERROR: rclone temp config missing or empty at readiness-gate time"
            exit 1
          fi
          RCLONE_PINNED_IMAGE="rclone/rclone@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548"
          # Hardcoded — must match the decode step and the Compose overlay.
          REMOTE_BASE="vault-recovery-crypt:Josemar/vault-recovery"
          PROBE=".deploy-probe-$(date +%s)"
          PROBE_CONTENT="vault-recovery deploy probe $(date -u +%FT%TZ)"

          # 1. REAL WRITE through the crypt boundary: a syntactically valid
          #    but unreachable remote fails here, BEFORE any teardown. The
          #    temp directory is mounted WRITABLE so rclone can refresh the
          #    working config (OAuth token refresh) in place; the container
          #    runs as the host runner UID:GID so any rewrite stays
          #    host-readable.
          if ! printf '%s' "$PROBE_CONTENT" | docker run --rm -i \
              --user "$(id -u):$(id -g)" \
              -v "$TMP_RCLONE_DIR:/tmp/rclone-conf:rw" \
              "$RCLONE_PINNED_IMAGE" \
              --config /tmp/rclone-conf/rclone.conf rcat "$REMOTE_BASE/$PROBE" >/dev/null 2>&1; then
            echo "ERROR: vault-recovery remote '$REMOTE_BASE' is UNREACHABLE (write probe failed). The encrypted lane cannot accept an initial generation. Deployment ABORTED BEFORE ANY TEARDOWN — the existing deployment and any legacy lane state are retained untouched."
            exit 1
          fi
          # 2. REAL READ-BACK through the crypt boundary (the generation
          #    verification round trip must work against the real remote).
          PROBE_BACK="$(docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$TMP_RCLONE_DIR:/tmp/rclone-conf:rw" \
              "$RCLONE_PINNED_IMAGE" \
              --config /tmp/rclone-conf/rclone.conf cat "$REMOTE_BASE/$PROBE" 2>/dev/null || true)"
          if [ "$PROBE_BACK" != "$PROBE_CONTENT" ]; then
            echo "ERROR: vault-recovery remote '$REMOTE_BASE' failed the read-back probe (crypt round trip broken). Deployment ABORTED BEFORE ANY TEARDOWN — the existing deployment and any legacy lane state are retained untouched."
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "$TMP_RCLONE_DIR:/tmp/rclone-conf:rw" \
              "$RCLONE_PINNED_IMAGE" \
              --config /tmp/rclone-conf/rclone.conf deletefile "$REMOTE_BASE/$PROBE" >/dev/null 2>&1 || true
            exit 1
          fi
          # 3. Cleanup the probe object (best effort; a leftover probe is
          #    harmless: it is not a generation and is never listed).
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$TMP_RCLONE_DIR:/tmp/rclone-conf:rw" \
            "$RCLONE_PINNED_IMAGE" \
            --config /tmp/rclone-conf/rclone.conf deletefile "$REMOTE_BASE/$PROBE" >/dev/null 2>&1 || \
            echo "WARNING: could not remove the deploy probe object $REMOTE_BASE/$PROBE; remove it manually (it is not a generation)"
          # If rclone refreshed the working config during the probes (OAuth
          # token refresh), the updated file now lives in the disposable
          # temp directory; the publish step detects it via the pre-probe
          # checksum and publishes the UPDATED config atomically.
          echo "vault-recovery remote readiness gate PASSED: real write + read-back round trip confirmed on '$REMOTE_BASE'"
          # Success: the publish step (the next step) owns the temp
          # directory and removes it on every exit; disarm the failure trap
          # so the directory survives this step's shell exit.
          trap - EXIT

      - name: Publish rclone config into shared volume
        # Publish the already-decoded/validated rclone config into the shared
        # obsidian-rclone-config volume atomically. The working config lives
        # in the disposable temp DIRECTORY created in the "Decode and
        # validate rclone config" step and was probed by the readiness gate
        # with that directory mounted WRITABLE. If rclone refreshed the
        # working config during the probes (OAuth token refresh writes a
        # sibling temp file and atomically renames it over the config — only
        # possible with a writable directory mount), the UPDATED file is
        # detected via the pre-probe checksum and published, so the runtime
        # services consume the refreshed tokens. The checksum comparison
        # runs ON THE HOST as the runner user: every writable temp-dir
        # rclone container runs as the host runner UID:GID, so an
        # rclone-rewritten config stays runner-owned and host-readable
        # (live ownership regression); the alpine publish container
        # mounts the temp dir READ-ONLY and stays root (it writes the
        # named volume atomically) and can never re-own the config.
        # The physical seed volume is resolved from Compose's rendered
        # config metadata (top-level `name`, honoring COMPOSE_PROJECT_NAME /
        # `-p`) plus the `com.docker.compose.volume=obsidian-rclone-config`
        # label — never guessed from `basename "$PWD"`. Outcome handling
        # (analogous to the legacy migration): 0 labeled matches creates the
        # volume WITH the compose labels (or reuses a pre-labeling volume of
        # the same compose-convention name); a Docker list/inspect
        # operational failure or >1 matches FAILS the deploy (never guess).
        # This step is the OWNER of the temp directory: it traps RECURSIVE
        # removal on EVERY exit (success AND failure), so the decoded secret
        # never lingers on the runner. Runs immediately after the readiness
        # gate so no intermediate step can fail with the temp directory
        # still on disk.
        run: |
          set -euo pipefail
          TMP_RCLONE_DIR="${RCLONE_TEMP_DIR:-}"
          if [ -z "$TMP_RCLONE_DIR" ]; then
            # No rclone config to publish (secret was unset — already failed
            # in the decode step for the default lane).
            exit 0
          fi
          # Cleanup on EVERY exit path of this step (success or failure).
          trap 'rm -rf "$TMP_RCLONE_DIR"' EXIT
          RCLONE_CONF="$TMP_RCLONE_DIR/rclone.conf"
          if [ ! -s "$RCLONE_CONF" ]; then
            echo "ERROR: rclone temp config missing or empty at publish time"
            exit 1
          fi
          # Detect an rclone-side refresh of the working config (OAuth
          # token refresh during the readiness probes): rclone replaced the
          # config inside the writable temp directory via sibling temp file
          # + atomic rename. When that happened, publish the UPDATED file
          # so the runtime services use the refreshed tokens.
          if [ -n "${RCLONE_CONFIG_SHA256:-}" ]; then
            CURRENT_SHA="$(sha256sum "$RCLONE_CONF" | awk '{print $1}')"
            if [ "$CURRENT_SHA" != "$RCLONE_CONFIG_SHA256" ]; then
              echo "rclone changed the working config during validation/probing (OAuth refresh); publishing the UPDATED config"
            fi
          fi
          # Resolve the ACTUAL physical volume for obsidian-rclone-config
          # from Compose's rendered config metadata (top-level `name`,
          # honoring COMPOSE_PROJECT_NAME / `-p`) plus the compose volume
          # label. Never guessed from `basename "$PWD"`.
          if ! PROJECT_NAME="$(docker compose config --format json 2>/dev/null | python3 -c 'import json, sys; print(json.load(sys.stdin)["name"])')"; then
            echo "ERROR: cannot resolve the Compose project name (docker compose config failed); aborting the seed publish instead of guessing"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "ERROR: Compose project name resolved to empty; aborting the seed publish instead of guessing"
            exit 1
          fi
          resolve_seed_volume() {
            if ! MATCHES="$(docker volume ls \
                --filter "label=com.docker.compose.project=$PROJECT_NAME" \
                --filter label=com.docker.compose.volume=obsidian-rclone-config \
                --format '{{.Name}}' 2>/dev/null)"; then
              echo "ERROR: cannot list Docker volumes for project '$PROJECT_NAME' (docker volume ls failed); aborting the seed publish instead of guessing"
              exit 1
            fi
            MATCH_COUNT="$(printf '%s\n' "$MATCHES" | grep -c . || true)"
          }
          # Outcome distinction (fail closed except the creation path):
          #   0 matches  -> no labeled volume yet: create it WITH the
          #                 compose labels so compose reuses it and future
          #                 resolution finds it (or reuse a pre-labeling
          #                 volume of the same compose-convention name);
          #   >1 matches -> FAIL the deploy (ambiguous; never guess).
          resolve_seed_volume
          if [ "$MATCH_COUNT" -eq 0 ]; then
            RCLONE_VOLUME="${PROJECT_NAME}_obsidian-rclone-config"
            if docker volume create \
                --label "com.docker.compose.project=$PROJECT_NAME" \
                --label "com.docker.compose.volume=obsidian-rclone-config" \
                "$RCLONE_VOLUME" >/dev/null 2>&1; then
              echo "Created obsidian-rclone-config volume '$RCLONE_VOLUME' (labeled for compose project '$PROJECT_NAME')"
            elif docker volume inspect "$RCLONE_VOLUME" >/dev/null 2>&1; then
              # Pre-existing volume without compose labels (pre-labeling
              # era): reuse it as-is — the name follows compose's
              # convention for the resolved project.
              echo "Reusing existing obsidian-rclone-config volume '$RCLONE_VOLUME' (created before compose labeling)"
            else
              echo "ERROR: cannot create or inspect the obsidian-rclone-config volume '$RCLONE_VOLUME' for project '$PROJECT_NAME'; aborting instead of guessing"
              exit 1
            fi
          elif [ "$MATCH_COUNT" -eq 1 ]; then
            RCLONE_VOLUME="$MATCHES"
          else
            echo "ERROR: expected exactly 1 obsidian-rclone-config volume for project '$PROJECT_NAME', found $MATCH_COUNT; aborting instead of guessing"
            exit 1
          fi
          # Named-volume-only guard: the resolved name must be an existing
          # Docker NAMED volume before anything is mounted or seeded.
          if ! docker volume inspect "$RCLONE_VOLUME" >/dev/null 2>&1; then
            echo "ERROR: resolved volume '$RCLONE_VOLUME' is not an inspectable Docker named volume; aborting instead of guessing"
            exit 1
          fi
          # Atomic publish into the shared obsidian-rclone-config volume:
          # copy the (possibly refreshed) working config to a temp file in
          # the volume, chmod 600, then mv into place so a reader never
          # sees a partial or world-readable config.
          docker run --rm \
            -v "$TMP_RCLONE_DIR:/config/source:ro" \
            -v "$RCLONE_VOLUME:/config/rclone" \
            alpine:3.20 \
            sh -c 'cp /config/source/rclone.conf /config/rclone/rclone.conf.new && chmod 600 /config/rclone/rclone.conf.new && mv /config/rclone/rclone.conf.new /config/rclone/rclone.conf'
          echo "rclone config loaded into Docker volume"

      - name: Populate browser-control persistent volumes
        env:
          BROWSER_TUNNEL_AUTHORIZED_KEY: ${{ secrets.BROWSER_TUNNEL_AUTHORIZED_KEY }}
        run: |
          set -euo pipefail
          # Populate the tailscale-serve-config and browser-tunnel-authorized-keys
          # named volumes using a pinned Alpine image (same Docker-only pattern
          # as the rclone config step). No host bind mounts of checkout files;
          # no deletion of volume contents on cleanup.
          #
          # tailscale-serve-config always receives a serve.json:
          #   - enabled: real legacy TCPForward to BC_HERMES_IP:2222
          #   - disabled: empty {} so stale tcp:2222 is cleared on restart/redeploy
          #
          # browser-tunnel-authorized-keys receives authorized_keys when enabled,
          # and is cleared when disabled.
          #
          # Copies into the volumes are atomic: write to a temp file in the same
          # volume, chmod, then mv into place so a reader never sees a partial
          # file.
          COMPOSE_PROJECT="$(basename "$PWD")"
          TS_SERVE_VOLUME="${COMPOSE_PROJECT}_tailscale-serve-config"
          AUTH_KEYS_VOLUME="${COMPOSE_PROJECT}_browser-tunnel-authorized-keys"

          docker volume create "$TS_SERVE_VOLUME" >/dev/null
          docker volume create "$AUTH_KEYS_VOLUME" >/dev/null

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          if [ "${BROWSER_CONTROL_ENABLED}" = "true" ]; then
            printf '%s\n' "{\"TCP\":{\"2222\":{\"TCPForward\":\"${BC_HERMES_IP}:2222\"}}}" > "$TMP_DIR/serve.json"
            printf '%s\n' "$BROWSER_TUNNEL_AUTHORIZED_KEY" > "$TMP_DIR/authorized_keys"
            chmod 600 "$TMP_DIR/authorized_keys"
          else
            printf '%s\n' '{}' > "$TMP_DIR/serve.json"
          fi

          # Atomic copy into tailscale-serve-config: temp file + chmod + mv.
          docker run --rm \
            -v "$TMP_DIR:/seed:ro" \
            -v "$TS_SERVE_VOLUME:/config/tailscale-serve" \
            alpine:3.20.3 \
            sh -c 'cp /seed/serve.json /config/tailscale-serve/serve.json.new && chmod 644 /config/tailscale-serve/serve.json.new && mv /config/tailscale-serve/serve.json.new /config/tailscale-serve/serve.json'

          if [ "${BROWSER_CONTROL_ENABLED}" = "true" ]; then
            # Atomic copy into browser-tunnel-authorized-keys.
            docker run --rm \
              -v "$TMP_DIR:/seed:ro" \
              -v "$AUTH_KEYS_VOLUME:/authorized-keys" \
              alpine:3.20.3 \
              sh -c 'mkdir -p /authorized-keys && cp /seed/authorized_keys /authorized-keys/authorized_keys.new && chmod 600 /authorized-keys/authorized_keys.new && mv /authorized-keys/authorized_keys.new /authorized-keys/authorized_keys'
          else
            # Clear any stale authorized key content from a previous enabled deploy.
            docker run --rm \
              -v "$AUTH_KEYS_VOLUME:/authorized-keys" \
              alpine:3.20.3 \
              sh -c 'rm -f /authorized-keys/authorized_keys 2>/dev/null || true'
          fi

      - name: Validate aux-ml model source
        if: vars.AUX_ML_ENABLED != 'false'
        run: |
          if [ -f "aux-ml/models/glm-ocr.gguf" ]; then
            echo "Found local glm-ocr model in repository checkout"
          else
            echo "No local glm-ocr model found; compose default URL will be used"
          fi

          if [ -f "aux-ml/models/mmproj-glm-ocr.gguf" ]; then
            echo "Found local mmproj model in repository checkout"
          else
            echo "No local mmproj model found; compose default URL will be used"
          fi

      - name: FRESH START - Remove Hermes data volume
        if: github.event.inputs.fresh_start == 'true'
        run: |
          echo "ERROR: fresh_start is disabled after moving state into /opt/data."
          echo "Use a manual, reviewed cleanup so runtime credentials, sessions, and vault mounts are not removed accidentally."
          exit 1

      - name: Stop existing services
        # Maximal, fail-closed teardown. We tear down with the SUPERSET of
        # overlays (base + vault-recovery + browser-control + embeddings +
        # mnemosyne + backup, plus the aux-ml, browser-control, and recovery
        # profiles — recovery only to remove a stale recovery service) so any
        # prior overlay-enabled service is removed even when this deploy is
        # switching to off or dropping an overlay. NO -v: named volumes are
        # always preserved. Both the superset teardown and the
        # selected-config teardown fail closed (set -euo pipefail, no || true).
        run: |
          set -euo pipefail
          echo "Tearing down any prior overlay-enabled stack (maximal superset, no -v)..."
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.vault-recovery.yml \
            -f docker-compose.browser-control.yml \
            -f docker-compose.embeddings.yml \
            -f docker-compose.mnemosyne.yml \
            -f docker-compose.mnemosyne-backup.yml \
            --profile aux-ml \
            --profile browser-control \
            --profile recovery \
            down --remove-orphans
          echo "Tearing down with selected config (no -v)..."
          IFS=':' read -ra FILES <<< "$COMPOSE_FILE"
          ARGS=()
          for f in "${FILES[@]}"; do
            ARGS+=("-f" "$f")
          done
          docker compose "${ARGS[@]}" down --remove-orphans

      - name: Migrate legacy rclone active config out of Mnemosyne backup state volume
        # Oracle upgrade-migration blocker. Legacy deployments (pre
        # OAuth-refresh fix) kept the private ACTIVE rclone config
        # (rclone.active.conf + its seed fingerprint sidecar) inside the
        # persistent mnemosyne-backup-state volume at /state. Hermes mounts
        # that volume READ-ONLY, so the legacy layout exposed the secret
        # config to Hermes and blocked the upgrade to the dedicated
        # uploader-only secret volume (mnemosyne-backup-rclone-config).
        # This migration runs AFTER the old services are stopped and BEFORE
        # Hermes/new services start: it deletes ONLY those two exact legacy
        # files at the volume root — never the ledger/slot acknowledgement
        # state — so the state volume again holds only non-secret state.
        # Fail-closed and safe:
        #   - the Compose project name is resolved from Compose's rendered
        #     config metadata (`docker compose config --format json`),
        #     honoring COMPOSE_PROJECT_NAME / `-p` — never guessed from
        #     `basename "$PWD"`;
        #   - the volume is located by the Compose project AND the
        #     `com.docker.compose.volume=mnemosyne-backup-state` label;
        #     0 matches is the ONLY safe skip; a Docker list/inspect
        #     operational failure or >1 matches FAILS the deploy (never
        #     guess);
        #   - the deletion runs INSIDE a disposable container mounting the
        #     NAMED volume, so an accidental host-path deletion is
        #     impossible;
        #   - exactly two basenames are removed at the volume root; the
        #     ledger/slot state is never touched (no recursive delete);
        #   - the files are only removed, never read or printed;
        #   - if a legacy file is still present after removal, the step
        #     FAILS the deploy (no partial upgrade).
        # The volume can exist from a prior deploy even when the current
        # MNEMOSYNE_DEPLOY_MODE is off, so this step runs unconditionally
        # and skips cleanly when no labeled volume matches (nothing to
        # migrate).
        run: |
          set -euo pipefail
          # Resolve the ACTUAL Compose project name from Compose's own
          # rendered config metadata (top-level `name` field), which honors
          # COMPOSE_PROJECT_NAME, `-p`, and the directory default. The
          # physical volume name is a Compose concern — never guessed from
          # `basename "$PWD"`.
          if ! PROJECT_NAME="$(docker compose config --format json 2>/dev/null | python3 -c 'import json, sys; print(json.load(sys.stdin)["name"])')"; then
            echo "ERROR: cannot resolve the Compose project name (docker compose config failed); aborting the legacy migration instead of guessing"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "ERROR: Compose project name resolved to empty; aborting the legacy migration instead of guessing"
            exit 1
          fi
          # Locate the state volume by the Compose project AND the
          # com.docker.compose.volume label (compose v2 labels every named
          # volume it creates). Outcome distinction:
          #   0 matches  -> safe skip (no legacy volume to migrate);
          #   docker volume ls operational failure -> FAIL the deploy;
          #   >1 matches -> FAIL the deploy (ambiguous; never guess).
          if ! MATCHES="$(docker volume ls \
              --filter "label=com.docker.compose.project=$PROJECT_NAME" \
              --filter label=com.docker.compose.volume=mnemosyne-backup-state \
              --format '{{.Name}}' 2>/dev/null)"; then
            echo "ERROR: cannot list Docker volumes for project '$PROJECT_NAME' (docker volume ls failed); aborting the legacy migration instead of guessing"
            exit 1
          fi
          MATCH_COUNT="$(printf '%s\n' "$MATCHES" | grep -c . || true)"
          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "No Mnemosyne backup state volume found for project '$PROJECT_NAME' (com.docker.compose.volume=mnemosyne-backup-state); legacy rclone active config migration skipped"
            exit 0
          fi
          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly 1 Mnemosyne backup state volume for project '$PROJECT_NAME', found $MATCH_COUNT; aborting the legacy migration instead of guessing"
            exit 1
          fi
          STATE_VOLUME="$MATCHES"
          # Named-volume-only guard: the resolved name must be an existing
          # Docker NAMED volume before anything is mounted or deleted.
          if ! docker volume inspect "$STATE_VOLUME" >/dev/null 2>&1; then
            echo "ERROR: resolved volume '$STATE_VOLUME' is not an inspectable Docker named volume; aborting instead of guessing"
            exit 1
          fi
          # Delete ONLY the two exact legacy secret files at the volume
          # root. The deletion runs inside a disposable alpine container
          # mounting the named volume at /state — a host path can never be
          # touched. The ledger/slot acknowledgement state is never
          # modified, and the legacy files are never read or printed (only
          # their basenames are reported). `set -euo pipefail` plus the
          # still-present re-check fail the deploy if the removal did not
          # happen.
          docker run --rm \
            -v "$STATE_VOLUME:/state" \
            alpine:3.20 \
            sh -c '
              found=0
              for f in /state/rclone.active.conf /state/rclone.active.conf.seed-fp; do
                if [ -e "$f" ] || [ -L "$f" ]; then
                  echo "removing legacy file: $(basename "$f")"
                  found=1
                fi
              done
              rm -f /state/rclone.active.conf /state/rclone.active.conf.seed-fp
              for f in /state/rclone.active.conf /state/rclone.active.conf.seed-fp; do
                if [ -e "$f" ] || [ -L "$f" ]; then
                  echo "ERROR: legacy file still present after removal: $(basename "$f")" >&2
                  exit 1
                fi
              done
              if [ "$found" -eq 0 ]; then
                echo "no legacy rclone active config files present in the state volume"
              else
                echo "legacy rclone active config files removed from the state volume"
              fi
            '
          echo "Legacy rclone active config migration complete (volume '$STATE_VOLUME' holds only non-secret acknowledgement state)"

      - name: Migrate stale vault-recovery uploader lock
        # Audited stale-lock migration. The vault-recovery uploader uses a
        # mkdir-based lock DIRECTORY at /state/.upload.lock inside the
        # persistent vault-recovery-uploader-state volume and FAILS CLOSED
        # at startup when the lock exists ("Upload already in progress"). A
        # stale empty lock dir (crashed/killed run, pre-fix uploader)
        # blocks the new uploader until removed. This step runs AFTER all
        # prior services are stopped and BEFORE new services start, and
        # removes ONLY an EMPTY legacy /state/.upload.lock via `rmdir`
        # inside a disposable named-volume container.
        # Fail-closed and safe (same rigor as the other migrations):
        #   - the Compose project name comes from Compose's rendered
        #     config metadata (honoring COMPOSE_PROJECT_NAME / `-p`),
        #     never guessed from `basename "$PWD"`;
        #   - the volume is located by the Compose project AND the
        #     `com.docker.compose.volume=vault-recovery-uploader-state`
        #     label; 0 matches is the ONLY safe skip; a Docker
        #     list/inspect operational failure or >1 matches FAILS the
        #     deploy (never guess);
        #   - ANY container (running or stopped) still mounting the
        #     volume FAILS the deploy — the migration must not race a
        #     live user;
        #   - the lock removal runs INSIDE a disposable container
        #     mounting the NAMED volume at /state; a host path can never
        #     be touched;
        #   - ONLY the empty lock DIRECTORY is removed, via `rmdir` (it
        #     cannot remove non-empty directories): a nonempty lock, a
        #     non-directory at the lock path, or a lock still present
        #     after removal FAILS the deploy;
        #   - no broad rm/rm -rf, no ledger/slot/secret/state deletion;
        #     the lock is never read or printed;
        #   - clean skip ONLY when the volume or the lock is absent.
        run: |
          set -euo pipefail
          # Resolve the ACTUAL Compose project name from Compose's own
          # rendered config metadata (top-level `name` field), which honors
          # COMPOSE_PROJECT_NAME, `-p`, and the directory default. Never
          # guessed from `basename "$PWD"`.
          if ! PROJECT_NAME="$(docker compose config --format json 2>/dev/null | python3 -c 'import json, sys; print(json.load(sys.stdin)["name"])')"; then
            echo "ERROR: cannot resolve the Compose project name (docker compose config failed); aborting the stale-lock migration instead of guessing"
            exit 1
          fi
          if [ -z "$PROJECT_NAME" ]; then
            echo "ERROR: Compose project name resolved to empty; aborting the stale-lock migration instead of guessing"
            exit 1
          fi
          # Locate the uploader state volume by the Compose project AND the
          # com.docker.compose.volume label. Outcome distinction:
          #   0 matches  -> safe skip (no volume to migrate);
          #   docker volume ls operational failure -> FAIL the deploy;
          #   >1 matches -> FAIL the deploy (ambiguous; never guess).
          if ! MATCHES="$(docker volume ls \
              --filter "label=com.docker.compose.project=$PROJECT_NAME" \
              --filter label=com.docker.compose.volume=vault-recovery-uploader-state \
              --format '{{.Name}}' 2>/dev/null)"; then
            echo "ERROR: cannot list Docker volumes for project '$PROJECT_NAME' (docker volume ls failed); aborting the stale-lock migration instead of guessing"
            exit 1
          fi
          MATCH_COUNT="$(printf '%s\n' "$MATCHES" | grep -c . || true)"
          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "No vault-recovery-uploader-state volume found for project '$PROJECT_NAME' (com.docker.compose.volume=vault-recovery-uploader-state); stale-lock migration skipped"
            exit 0
          fi
          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly 1 vault-recovery-uploader-state volume for project '$PROJECT_NAME', found $MATCH_COUNT; aborting the stale-lock migration instead of guessing"
            exit 1
          fi
          STATE_VOLUME="$MATCHES"
          # Named-volume-only guard: the resolved name must be an existing
          # Docker NAMED volume before anything is mounted or removed.
          if ! docker volume inspect "$STATE_VOLUME" >/dev/null 2>&1; then
            echo "ERROR: resolved volume '$STATE_VOLUME' is not an inspectable Docker named volume; aborting instead of guessing"
            exit 1
          fi
          # Verify NO container (running or stopped) still mounts the
          # volume: the migration must never race a live user.
          if ! MOUNTED_CONTAINERS="$(docker ps -aq --filter "volume=$STATE_VOLUME" 2>/dev/null)"; then
            echo "ERROR: cannot list containers mounting '$STATE_VOLUME' (docker ps failed); aborting the stale-lock migration instead of guessing"
            exit 1
          fi
          if [ -n "$(printf '%s' "$MOUNTED_CONTAINERS" | tr -d '[:space:]')" ]; then
            echo "ERROR: container(s) still mount volume '$STATE_VOLUME' ($(printf '%s' "$MOUNTED_CONTAINERS" | tr '\n' ' ')); aborting the stale-lock migration instead of racing a live user"
            exit 1
          fi
          # Remove ONLY an EMPTY legacy lock directory via `rmdir` inside a
          # disposable alpine container mounting the NAMED volume at /state
          # — a host path can never be touched, and rmdir cannot remove
          # non-empty directories, so no state can ever be deleted. The
          # lock is never read or printed. Clean skip when the lock is
          # absent; every other outcome fails the deploy.
          docker run --rm \
            -v "$STATE_VOLUME:/state" \
            alpine:3.20 \
            sh -c '
              if [ ! -e /state/.upload.lock ]; then
                echo "no legacy .upload.lock present in the uploader state volume; stale-lock migration skipped"
                exit 0
              fi
              if [ ! -d /state/.upload.lock ]; then
                echo "ERROR: /state/.upload.lock exists but is not a directory; refusing to remove it" >&2
                exit 1
              fi
              if [ -n "$(ls -A /state/.upload.lock 2>/dev/null)" ]; then
                echo "ERROR: /state/.upload.lock is not empty; refusing to remove it (it may hold state)" >&2
                exit 1
              fi
              rmdir /state/.upload.lock || {
                echo "ERROR: rmdir failed on /state/.upload.lock" >&2
                exit 1
              }
              if [ -e /state/.upload.lock ]; then
                echo "ERROR: /state/.upload.lock still present after rmdir" >&2
                exit 1
              fi
              echo "removed empty legacy lock directory /state/.upload.lock"
            '
          echo "Stale vault-recovery uploader lock migration complete (volume '$STATE_VOLUME')"

      - name: Clean up old Docker images
        run: |
          docker image prune -a -f
          docker builder prune -f
          docker rmi $(docker images 'josemar-assistente*' -q) 2>/dev/null || true

      - name: Build Docker image
        run: docker compose build --no-cache

      - name: Start services
        run: docker compose up -d

      - name: Verify embeddings overlay selection
        run: |
          set -euo pipefail
          MAXIMAL_ARGS=(-f docker-compose.yml -f docker-compose.vault-recovery.yml \
            -f docker-compose.browser-control.yml -f docker-compose.embeddings.yml \
            -f docker-compose.mnemosyne.yml -f docker-compose.mnemosyne-backup.yml)
          if [ "${GBRAIN_EMBEDDINGS_ENABLED}" = "true" ] || [ "${MNEMOSYNE_DEPLOY_MODE}" = "pilot" ] || [ "${MNEMOSYNE_DEPLOY_MODE}" = "backup" ]; then
            echo "Checking selected embeddings service health..."
            if ! docker compose "${MAXIMAL_ARGS[@]}" ps embeddings --format json | grep -q '"Health":"healthy"'; then
              echo "ERROR: embeddings service is selected but is not healthy"
              docker compose "${MAXIMAL_ARGS[@]}" ps embeddings
              exit 1
            fi
          else
            echo "Confirming embeddings service is absent..."
            if docker compose "${MAXIMAL_ARGS[@]}" ps --all --format json embeddings | grep -q '"Name"'; then
              echo "ERROR: embeddings service is present when overlay is not selected"
              docker compose "${MAXIMAL_ARGS[@]}" ps --all embeddings
              exit 1
            fi
          fi

      - name: Verify tailscale sidecar login
        run: |
          echo "Checking tailscale sidecar status..."
          if ! docker compose ps tailscale | grep -q "Up"; then
            echo "ERROR: tailscale service is not running"
            docker compose ps
            exit 1
          fi

          TS_IP=""
          for i in {1..30}; do
            TS_IP="$(docker compose exec -T tailscale tailscale ip -4 2>/dev/null | sed -n '1p')"
            if echo "$TS_IP" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Tailscale sidecar connected with IPv4: $TS_IP"
              break
            fi
            echo "Waiting for tailscale login/connection... ($i/30)"
            sleep 2
          done

          if ! echo "$TS_IP" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tailscale sidecar is running but not logged in/connected"
            echo "Set TS_AUTHKEY secret or log in manually with: docker compose exec -T tailscale tailscale up"
            docker compose logs --tail=120 tailscale
            exit 1
          fi

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for container to be healthy..."
          for i in {1..30}; do
            if docker compose ps | grep -q "healthy"; then
              echo "Container is healthy"
              break
            fi
            echo "   Waiting... ($i/30)"
            sleep 2
          done

      - name: Verify deployment
        run: |
          PREFIX="${JOSEMAR_CONTAINER_PREFIX:-josemar}"
          docker ps --format '{{.Names}}' | grep -Fx "${PREFIX}-hermes"

      - name: Verify skill deployment
        run: |
          echo "Checking deployed skills..."
          docker compose exec -T hermes ls -la /opt/josemar/skills/ 2>/dev/null || echo "No skills deployed yet"

      - name: Verify Hermes Python dependencies
        run: |
          docker compose exec -T hermes python3 - <<'PY'
          import importlib.util
          import sys

          missing = [
              module
              for module in ("markdown", "pymupdf")
              if importlib.util.find_spec(module) is None
          ]
          print(f"python={sys.executable}")
          if missing:
              raise SystemExit(f"Missing Hermes Python dependencies: {', '.join(missing)}")
          print("Hermes Python dependencies OK")
          PY

      - name: Verify browser-control sidecars (only when enabled)
        if: vars.BROWSER_CONTROL_ENABLED == 'true'
        run: |
          # browser-tunnel sidecar must be running. We do NOT require the
          # laptop/Chrome to be online — only that the SSH daemon started and
          # Tailscale Serve picked up the TCP forward config with the exact
          # expected target.
          echo "Checking browser-tunnel sidecar..."
          if ! docker compose ps browser-tunnel | grep -q "Up"; then
            echo "ERROR: browser-tunnel service is not running"
            docker compose ps
            docker compose logs --tail=80 browser-tunnel
            exit 1
          fi

          echo "Checking Tailscale Serve TCP config for tcp:2222 -> ${BC_HERMES_IP}:2222..."
          EXPECTED_TARGET="${BC_HERMES_IP}:2222"
          SERVE_OK=0
          for i in {1..20}; do
            SERVE_OUT="$(docker compose exec -T tailscale tailscale serve status --json 2>/dev/null || true)"
            if echo "$SERVE_OUT" | grep -q '"2222"' && echo "$SERVE_OUT" | grep -q "$EXPECTED_TARGET"; then
              echo "Tailscale Serve tcp:2222 -> $EXPECTED_TARGET is configured"
              # Assert no Funnel is configured.
              if echo "$SERVE_OUT" | grep -q '"Funnel"'; then
                echo "ERROR: Tailscale Funnel is configured; browser control must never use Funnel"
                exit 1
              fi
              SERVE_OK=1
              break
            fi
            echo "Waiting for Tailscale Serve to apply config... ($i/20)"
            sleep 2
          done
          if [ "$SERVE_OK" -ne 1 ]; then
            echo "ERROR: Tailscale Serve tcp:2222 -> $EXPECTED_TARGET was not applied"
            docker compose logs --tail=80 tailscale
            exit 1
          fi

      - name: Verify Tailscale Serve is cleared (only when disabled)
        if: vars.BROWSER_CONTROL_ENABLED != 'true'
        run: |
          # The disabled deploy wrote {} into tailscale-serve-config, so
          # tcp:2222 must not be present after Tailscale picks it up.
          SERVE_OK=0
          for i in {1..20}; do
            SERVE_OUT="$(docker compose exec -T tailscale tailscale serve status --json 2>/dev/null || true)"
            if echo "$SERVE_OUT" | grep -q '"2222"'; then
              echo "ERROR: stale Tailscale Serve tcp:2222 still present after disabled redeploy"
              docker compose logs --tail=80 tailscale
              exit 1
            fi
            # Empty serve config is reported as an empty/no TCP map; treat
            # absence of 2222 as success.
            SERVE_OK=1
            break
          done
          if [ "$SERVE_OK" -ne 1 ]; then
            echo "WARNING: could not confirm Tailscale Serve status; verify manually"
          fi

      - name: Verify Mnemosyne off (overlays absent, provider disabled)
        if: vars.MNEMOSYNE_DEPLOY_MODE != 'pilot' && vars.MNEMOSYNE_DEPLOY_MODE != 'backup'
        run: |
          set -euo pipefail
          # off: no Mnemosyne overlay services should be present, and the
          # Hermes-side provider must be disabled. The Hermes init logs
          # activation failures nonfatally, so container health alone is not
          # enough — we explicitly assert the overlays are absent and the
          # provider is not mnemosyne in the rendered config.
          #
          # Stale Mnemosyne overlay services are queried using the MAXIMAL
          # compose file set (base + browser-control + embeddings + mnemosyne
          # + backup), NOT the selected off-mode config, so orphan containers
          # from a failed teardown are detected. The `embeddings` service is
          # deliberately NOT checked here: with GBRAIN_EMBEDDINGS_ENABLED=true
          # and MNEMOSYNE_DEPLOY_MODE=off, standalone gbrain embeddings are
          # permitted and are verified solely by the dedicated "Verify
          # embeddings overlay selection" step.
          echo "Confirming no Mnemosyne overlay services are running (maximal compose set)..."
          MAXIMAL_ARGS=(-f docker-compose.yml -f docker-compose.vault-recovery.yml \
            -f docker-compose.browser-control.yml -f docker-compose.embeddings.yml \
            -f docker-compose.mnemosyne.yml -f docker-compose.mnemosyne-backup.yml)
          for svc in mnemosyne-backup-uploader mnemosyne-backup-recover; do
            if docker compose "${MAXIMAL_ARGS[@]}" ps --format json "$svc" 2>/dev/null | grep -q '"Name"'; then
              echo "ERROR: Mnemosyne overlay service '$svc' is still running in off mode (stale teardown)"
              docker compose "${MAXIMAL_ARGS[@]}" ps
              exit 1
            fi
          done
          echo "No Mnemosyne overlay services running"

          echo "Confirming Hermes provider is disabled via hermes_cli.config.load_config()..."
          # Use the Hermes venv python with hermes_cli.config.load_config() to
          # load /opt/data/config.yaml and assert the exact memory subtree.
          # The Hermes init logs activation failures nonfatally, so container
          # health alone is not enough.
          docker compose exec -T hermes /opt/hermes/.venv/bin/python3 - <<'PY'
          import sys
          try:
              from hermes_cli.config import load_config
          except Exception as exc:
              print(f"ERROR: could not import hermes_cli.config: {exc}", file=sys.stderr)
              sys.exit(1)
          config = load_config()
          if config is None:
              print("ERROR: /opt/data/config.yaml is missing or empty", file=sys.stderr)
              sys.exit(1)
          memory = config.get("memory")
          if not isinstance(memory, dict):
              print("ERROR: memory subtree is not a dict", file=sys.stderr)
              sys.exit(1)
          provider = memory.get("provider", "") or ""
          if provider == "mnemosyne":
              print("ERROR: memory.provider is 'mnemosyne' in off mode", file=sys.stderr)
              sys.exit(1)
          # Static memory flags must be restored to base template values.
          if memory.get("memory_enabled") is not True:
              print("ERROR: memory_enabled is not true in off mode (static injection not restored)", file=sys.stderr)
              sys.exit(1)
          if memory.get("user_profile_enabled") is not True:
              print("ERROR: user_profile_enabled is not true in off mode (static injection not restored)", file=sys.stderr)
              sys.exit(1)
          # Nested mnemosyne config must be absent.
          if "mnemosyne" in memory:
              print("ERROR: nested memory.mnemosyne config lingers in off mode", file=sys.stderr)
              sys.exit(1)
          print("OFF_PROVIDER_DISABLED_OK")
          PY

          echo "Confirming no mnemosyne-backup-export cron job is installed..."
          docker compose exec -T hermes /opt/hermes/.venv/bin/python3 - <<'PY'
          import json, sys
          try:
              with open("/opt/data/cron/jobs.json", encoding="utf-8") as fh:
                  data = json.load(fh)
              jobs = data.get("jobs", [])
          except Exception as exc:
              print(f"ERROR: could not read /opt/data/cron/jobs.json: {exc}", file=sys.stderr)
              sys.exit(1)
          export_jobs = [j for j in jobs if isinstance(j, dict) and j.get("name") == "mnemosyne-backup-export"]
          if export_jobs:
              print("ERROR: mnemosyne-backup-export cron job is installed in off mode", file=sys.stderr)
              sys.exit(1)
          print("OFF_NO_EXPORT_CRON_OK")
          PY
          echo "Mnemosyne off confirmed (overlays absent, provider disabled, no export cron)"

      - name: Verify Mnemosyne pilot (TEI healthy + provider/policy active)
        if: vars.MNEMOSYNE_DEPLOY_MODE == 'pilot' || vars.MNEMOSYNE_DEPLOY_MODE == 'backup'
        run: |
          set -euo pipefail
          # pilot (and backup, which includes pilot): the embeddings service
          # must be healthy, and the Hermes provider must be mnemosyne with the
          # pilot policy active. The Hermes init logs activation failures
          # nonfatally, so container health alone is not enough — we explicitly
          # assert the provider/policy via hermes_cli.config.load_config() and
          # that the init did not log an activation failure.
          echo "Checking embeddings service health..."
          # Wait budget: 120 iterations x 5s = 600s (>= 450s), enough for a
          # cold first model download. Fail immediately if the embeddings
          # container exits.
          HEALTHY=0
          for i in $(seq 1 120); do
            STATUS="$(docker compose ps embeddings --format json 2>/dev/null | python3 -c '
          import json, sys
          try:
              line = sys.stdin.read().strip()
              if not line:
                  print(""); sys.exit(0)
              obj = json.loads(line)
              print(obj.get("State", "") or obj.get("Status", ""))
          except Exception:
              print("")
          ' 2>/dev/null || true)"
            case "$STATUS" in
              exited|Exit*)
                echo "ERROR: embeddings container exited before becoming healthy"
                docker compose ps
                docker compose logs --tail=120 embeddings
                exit 1
                ;;
            esac
            if docker compose ps embeddings 2>/dev/null | grep -q "healthy"; then
              HEALTHY=1
              break
            fi
            echo "   Waiting for embeddings health... ($i/120)"
            sleep 5
          done
          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: embeddings service is not healthy after 600s"
            docker compose ps
            docker compose logs --tail=120 embeddings
            exit 1
          fi
          echo "embeddings service is healthy"

          echo "Confirming Hermes provider/policy via hermes_cli.config.load_config()..."
          # The hermes cont-init script (00-josemar-setup) runs AFTER the
          # container's cheap healthcheck (hermes version) passes, so the
          # Mnemosyne config may not be written yet when this step starts.
          # Poll up to 60s (12 x 5s) for the init to write memory.provider and
          # the pilot policy, then fail with the last error.
          PROVIDER_OK=0
          for i in $(seq 1 12); do
            if docker compose exec -T hermes /opt/hermes/.venv/bin/python3 - <<'PY' 2>/dev/null
          import sys
          try:
              from hermes_cli.config import load_config
          except Exception as exc:
              print(f"ERROR: could not import hermes_cli.config: {exc}", file=sys.stderr)
              sys.exit(1)
          config = load_config()
          if config is None:
              print("ERROR: /opt/data/config.yaml is missing or empty", file=sys.stderr)
              sys.exit(1)
          memory = config.get("memory")
          if not isinstance(memory, dict):
              print("ERROR: memory subtree is not a dict", file=sys.stderr)
              sys.exit(1)
          provider = memory.get("provider", "") or ""
          if provider != "mnemosyne":
              print(f"ERROR: memory.provider is not 'mnemosyne' (got: '{provider}')", file=sys.stderr)
              sys.exit(1)
          if memory.get("memory_enabled") is not False:
              print("ERROR: memory_enabled is not false in pilot mode", file=sys.stderr)
              sys.exit(1)
          if memory.get("user_profile_enabled") is not False:
              print("ERROR: user_profile_enabled is not false in pilot mode", file=sys.stderr)
              sys.exit(1)
          nested = memory.get("mnemosyne")
          if not isinstance(nested, dict):
              print("ERROR: nested memory.mnemosyne config is absent in pilot mode", file=sys.stderr)
              sys.exit(1)
          print("PILOT_PROVIDER_POLICY_OK")
          PY
            then
              PROVIDER_OK=1
              break
            fi
            echo "   Waiting for Hermes init to write Mnemosyne config... ($i/12)"
            sleep 5
          done
          if [ "$PROVIDER_OK" -ne 1 ]; then
            echo "ERROR: Hermes memory.provider/mnemosyne policy not active after 60s"
            docker compose exec -T hermes /opt/hermes/.venv/bin/python3 - <<'PY'
          import sys
          try:
              from hermes_cli.config import load_config
          except Exception as exc:
              print(f"could not import hermes_cli.config: {exc}", file=sys.stderr)
              sys.exit(1)
          config = load_config()
          if config is not None:
              import json
              print(json.dumps(config.get("memory", {}), indent=2, default=str))
          PY
            docker compose logs --tail=200 hermes
            exit 1
          fi

          echo "Confirming init did not log a nonfatal activation failure..."
          if docker compose logs --tail=400 hermes 2>/dev/null | grep -q "mnemosyne runtime config activation failed"; then
            echo "ERROR: Hermes init logged a Mnemosyne activation failure"
            docker compose logs --tail=400 hermes
            exit 1
          fi
          echo "Mnemosyne pilot verified"

      - name: Verify Mnemosyne backup (uploader running + exactly one export cron)
        if: vars.MNEMOSYNE_DEPLOY_MODE == 'backup'
        run: |
          set -euo pipefail
          # backup adds: the uploader service must be running, and there must
          # be exactly one mnemosyne-backup-export cron job whose interval
          # matches MNEMOSYNE_BACKUP_EXPORT_INTERVAL. The Hermes init logs
          # activation failures nonfatally, so container health alone is not
          # enough.
          echo "Checking mnemosyne-backup-uploader is running..."
          if ! docker compose ps mnemosyne-backup-uploader 2>/dev/null | grep -q "Up"; then
            echo "ERROR: mnemosyne-backup-uploader service is not running"
            docker compose ps
            docker compose logs --tail=120 mnemosyne-backup-uploader
            exit 1
          fi
          echo "mnemosyne-backup-uploader is running"

          echo "Confirming exactly one mnemosyne-backup-export cron job with the canonical validator..."
          docker compose exec -T hermes /opt/hermes/.venv/bin/python3 \
            /opt/josemar/scripts/verify_mnemosyne_backup_cron.py \
            --jobs-file /opt/data/cron/jobs.json \
            --expected-interval "${MNEMOSYNE_BACKUP_EXPORT_INTERVAL}"
          echo "Mnemosyne backup verified"

      - name: Verify vault-recovery deployment (uploader + export cron + plaintext absence)
        run: |
          set -euo pipefail
          # Phase 3: the encrypted vault-recovery lane is the DEFAULT backup
          # composition (the retired plaintext obsidian-backup service is
          # gone). The Hermes init logs cron failures nonfatally, so
          # container health alone is not enough — we explicitly assert the
          # uploader is running, exactly one vault-recovery-export cron job
          # exists with the real jobs.json schema, and NO obsidian-backup
          # container lingers.
          echo "Checking vault-recovery-uploader is running..."
          if ! docker compose ps vault-recovery-uploader 2>/dev/null | grep -q "Up"; then
            echo "ERROR: vault-recovery-uploader service is not running"
            docker compose ps
            docker compose logs --tail=120 vault-recovery-uploader
            exit 1
          fi
          echo "vault-recovery-uploader is running"

          echo "Confirming exactly one vault-recovery-export cron job with the real schema..."
          # The actual jobs.json shape is {"jobs": [...], "updated_at": ...}
          # with schedule objects {"kind":"cron","expr":"0 4 * * *"},
          # script="hermes-vault-recovery-export-cron.sh", no_agent=true,
          # workdir=/opt/data. The expr must match the base compose default
          # VAULT_RECOVERY_EXPORT_SCHEDULE.
          docker compose exec -T hermes /opt/hermes/.venv/bin/python3 - <<'PY'
          import json, sys, time
          # The Hermes cont-init (docker-hermes-init.sh) creates the
          # vault-recovery-export cron job shortly AFTER the container passes
          # the cheap healthcheck, so this verify step can race the init and
          # read an empty/absent job set (observed live: health verified at
          # 15:55:14, jobs.json read at 15:55:18-19 with 0 jobs, job created
          # at 15:55:24 — a ~10s window that produced a false-negative deploy
          # failure). Poll for the named job with a bounded 60s budget before
          # the strict schema assertion below; a job still missing after the
          # budget is a REAL failure (Hermes init logs cron creation failures
          # nonfatally, so container health alone is not enough).
          job_name = "vault-recovery-export"
          deadline = time.monotonic() + 60
          last_error = "job never appeared"
          while time.monotonic() < deadline:
              try:
                  with open("/opt/data/cron/jobs.json", encoding="utf-8") as fh:
                      data = json.load(fh)
                  jobs = data.get("jobs")
                  if not isinstance(jobs, list):
                      last_error = "jobs.json 'jobs' is not a list"
                  elif any(isinstance(j, dict) and j.get("name") == job_name for j in jobs):
                      break
                  else:
                      last_error = f"jobs.json present but has no {job_name!r} job"
              except Exception as exc:
                  last_error = f"could not read /opt/data/cron/jobs.json: {exc}"
              time.sleep(5)
          else:
              print(
                  f"ERROR: timed out after 60s waiting for the {job_name!r} cron job to appear "
                  f"in /opt/data/cron/jobs.json (last state: {last_error}); Hermes init logs "
                  f"cron creation failures nonfatally - check 'docker compose logs hermes'",
                  file=sys.stderr,
              )
              sys.exit(1)
          expected_expr = "0 4 * * *"
          try:
              with open("/opt/data/cron/jobs.json", encoding="utf-8") as fh:
                  data = json.load(fh)
          except Exception as exc:
              print(f"ERROR: could not read /opt/data/cron/jobs.json: {exc}", file=sys.stderr)
              sys.exit(1)
          jobs = data.get("jobs")
          if not isinstance(jobs, list):
              print("ERROR: jobs.json 'jobs' is not a list", file=sys.stderr)
              sys.exit(1)
          export_jobs = [j for j in jobs if isinstance(j, dict) and j.get("name") == "vault-recovery-export"]
          if len(export_jobs) != 1:
              print(f"ERROR: expected exactly 1 vault-recovery-export cron job, got {len(export_jobs)}", file=sys.stderr)
              sys.exit(1)
          job = export_jobs[0]
          schedule = job.get("schedule")
          if not isinstance(schedule, dict):
              print("ERROR: schedule is not an object", file=sys.stderr)
              sys.exit(1)
          if schedule.get("kind") != "cron":
              print(f"ERROR: schedule.kind is not 'cron' (got: {schedule.get('kind')!r})", file=sys.stderr)
              sys.exit(1)
          expr = schedule.get("expr")
          if expr != expected_expr:
              print(f"ERROR: schedule.expr {expr!r} does not match VAULT_RECOVERY_EXPORT_SCHEDULE {expected_expr!r}", file=sys.stderr)
              sys.exit(1)
          if job.get("script") != "hermes-vault-recovery-export-cron.sh":
              print(f"ERROR: script is not 'hermes-vault-recovery-export-cron.sh' (got: {job.get('script')!r})", file=sys.stderr)
              sys.exit(1)
          if job.get("no_agent") is not True:
              print(f"ERROR: no_agent is not true (got: {job.get('no_agent')!r})", file=sys.stderr)
              sys.exit(1)
          workdir = job.get("workdir")
          if workdir != "/opt/data":
              print(f"ERROR: workdir is not '/opt/data' (got: {workdir!r})", file=sys.stderr)
              sys.exit(1)
          print(f"VAULT_RECOVERY_CRON_OK expr={expr} workdir={workdir}")
          PY

          echo "Confirming the plaintext obsidian-backup container is absent..."
          PREFIX="${JOSEMAR_CONTAINER_PREFIX:-josemar}"
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${PREFIX}-obsidian-backup"; then
            echo "ERROR: retired plaintext obsidian-backup container still exists after deploy"
            docker ps -a --filter "name=${PREFIX}-obsidian-backup"
            exit 1
          fi
          echo "obsidian-backup absent (plaintext lane retired)"
          echo "Vault-recovery deployment verified"

      - name: Cleanup sensitive files
        if: always()
        # Final sweep on EVERY exit path, including a cancelled run: the
        # decoded rclone temp DIRECTORY must never linger on the runner even
        # when the run is cancelled BETWEEN the rclone steps (a step-local
        # trap only fires inside its own shell; the decode/readiness/publish
        # traps cover in-step failures, this always() step covers the
        # between-step cancellation window). RCLONE_TEMP_DIR is exported to
        # GITHUB_ENV by the decode step, so it is visible here whenever it
        # was created; the guard also covers the case where decode never ran.
        run: |
          rm -f .env
          if [ -n "${RCLONE_TEMP_DIR:-}" ]; then
            rm -rf "$RCLONE_TEMP_DIR"
          fi
